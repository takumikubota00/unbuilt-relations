senato-milan-color-skoda-ricardo-orts-design-week-2026/"}], "why": ["w_dream"], "year": 2023, "yearEnd": null, "yearU": true}, {"author": ["a_zha"], "channel": "ch_ext", "coding": "c_simple", "color": null, "country": "c_uk", "desc": "【糸】名前：自社の名をプロンプトに入れる／計算：生成AIで案をつくる／審査と落選：コンペの初期案に使う\n2023年、パトリック・シューマッハーは、ZHAが多くのプロジェクトのコンペや初期段階でDALL-E 2やMidjourneyを使っていると明かした。プロンプトのほぼすべてに「Zaha Hadid」を入れ、選び、練り上げることで作者性を引き受けると述べた。のちに自社の画像で学習させたStable Diffusionのモデルも使っている（RIBA Journal）。故人の名前が生成画像の様式として事務所に戻ってくる循環。シューマッハーは1996年にAAでデザイン・リサーチ・ラボ（DRL）を共同創設している。\n【第5章】5-5で論じる。\n【v9.1】流通の型を「古典の延長」に変更。古典の作り手の側が、設計競技の提案に生成AIの画像を使う事例として扱う（5-5、5-6-4）。", "era": "e_sns", "groups": ["g_genai", "g_cyber"], "id": "s_zha_ai", "image": null, "intent": "i_both", "label": "ZHAの画像生成AI（「Zaha Hadid」を含むプロンプト）", "layer": ["l_a"], "medium": ["m_ai"], "motif": ["m_name", "m_calc", "m_jury"], "primary": "pr_online", "primaryRef": "【確認済】シューマッハーへのインタビュー（RIBA Journal）と紹介された画像", "role": "paper", "shape": null, "showImage": false, "summary": "ZHA自身が「Zaha Hadid」を含むプロンプトで、画像生成AIを設計の初期段階に使う。", "type": "work", "urls": [{"title": "Dezeen: ZHA developing \"most\" projects using AI images (2023)", "url": "https://www.dezeen.com/2023/04/26/zaha-hadid-architects-patrik-schumacher-ai-dalle-midjourney/"}, {"title": "RIBA Journal: Patrik Schumacher on AI's opportunities", "url": "https://www.ribaj.com/intelligence/patrik-schumacher-ai-opportunity"}], "why": ["w_dream"], "year": 2023, "yearEnd": null, "yearU": false}, {"author": ["ax_083"], "channel": "ch_sns", "coding": "c_none", "color": null, "country": "cx_04", "desc": "【流通】設計者による画像の公開と、SNS・報道での拡散。\n【糸】巨大構造：周長約3kmの環／既存の都市の上：ドバイの中心街の上に浮かぶ／CG・映像／設計競技：応募案／自前の媒体：設計者が自ら公開\nドバイのZnera Space（ナジュムス・チョードリー、ニルス・レメス）の案。もとはドバイ未来財団のコンペへの応募案で、最終候補に残ったと伝えられたあと連絡がなかったため、設計者が画像を公開した。チョードリーは「現代の建築の可能性について会話を始めたい」と述べた（Khaleej Times、2022年8月19日）。建設の計画はない。\nコンペの案が、審査の結果を待たずに設計者自身の手で流通に乗った事例。\n【要確認】最初の公開がInstagramだったかは未確認（記事は同社のInstagramの説明文を引用している）。\n【第5章】5-1、5-4-3で論じる。", "era": "e_sns", "groups": ["g_cgsns", "g_gulf"], "id": "x_downtowncircle", "image": null, "intent": "i_both", "label": "Znera Space《ダウンタウン・サークル》", "layer": [], "medium": ["m_digital"], "motif": ["m_mega", "m_overlay", "m_render", "m_jury", "m_self"], "primary": "pr_online", "primaryRef": "", "role": "paper", "shape": null, "showImage": false, "summary": "ブルジュ・ハリファを囲む、高さ約500m・周長約3kmの環状の建物の案。コンペの応募案を、設計者が自ら画像で公開した。", "type": "work", "urls": [{"title": "Khaleej Times (2022-08-19)", "url": "https://khaleejtimes.com/uae/uae-architects-propose-giant-500-metre-tall-ring-to-encircle-burj-khalifa-downtown-dubai"}], "why": ["w_dream", "w_cond"], "year": 2022, "yearEnd": null, "yearU": false}, {"author": ["ax_088"], "channel": "ch_sns", "coding": "c_none", "color": null, "country": null, "desc": "【流通】Instagramなどへの投稿。2020年にはGestaltenが作品集を刊行した。\n【糸】CG・映像：写真のように描かれた実在しない空間／ドローイング：一枚の画像として完結する／自前の媒体：作家のアカウント\n『Metropolis』（ジャクソン・ストーン、2021年2月23日）は、建築の表現とCGを使って現実と虚構を混ぜる「デジタルアートの新しい美的運動」としてドリームスケープを紹介した。記事は、この運動が「SNSと切り離せない」こと、ドリームスケープが「建てるためのものではない」ことを明記している。シャーロット・テイラー（フォロワー20万人以上）、ヴィクトル・ルーセル、Zyva Studioなどの名が挙がる。「建物を設計するのに建築家である必要はない」とも書かれている。\n記事に生成AIへの言及はない。建築家でない作り手が、建てるつもりのない空間の画像をSNSに出すという型は、生成AIの一般公開（2022）より前にできていた。\n【第5章】5-1、5-4-2で論じる。", "era": "e_sns", "groups": ["g_cgsns"], "id": "x_dreamscape", "image": null, "intent": "i_nobuild", "label": "ドリームスケープ（建たない室内・建築のCG）", "layer": [], "medium": ["m_digital"], "motif": ["m_render", "m_drawing", "m_self"], "primary": "pr_online", "primaryRef": "", "role": "paper", "shape": null, "showImage": false, "summary": "3DCGで実在しない室内や建築を描き、SNSに投稿する作家たちの傾向。『Metropolis』は2021年に「ドリームスケープ運動」と呼んだ。", "type": "movement", "urls": [{"title": "Metropolis: Form Follows Fantasy: The Rise of the Dreamscapes Movement (2021-02-23)", "url": "https://metropolismag.com/viewpoints/form-follows-fantasy-the-rise-of-the-dreamscapes-movement/"}], "why": ["w_dream"], "year": 2020, "yearEnd": null, "yearU": false}, {"author": ["ax_047"], "channel": "ch_inst", "coding": "c_none", "color": null, "country": "cx_08", "desc": "【流通】リヤドのディルイーヤ・ビエンナーレ財団での展示（2023年4月29日まで）。\n【糸】展覧会：大型模型・レンダリング・インスタレーションによる没入型の展示\nArchitects’ Journalの報道をArchinect（2023年2月2日）が紹介した。名が挙がったのは、ピーター・クック、アジャイ・アソシエイツ、OMA、ペイ・コブ・フリード、スタジオ・フクサス、オイラー・ウー、モーフォシス、トム・ウィスコム、HOK、デルガン・マイスル、UNスタジオ、コープ・ヒンメルブラウの12組。案は誰のものか明示されず、各組の関与の範囲は不明とされた。\nアーキグラムのメンバーと、1988年のMoMA「脱構築主義の建築」展の出品者が、2020年代の巨大構想の設計者として現れた場。\n【要確認】2023年のヴェネツィアでの展示は未確認。\n【第5章】5-6-4で論じる。", "era": "e_sns", "groups": ["g_gulf"], "id": "x_lineexpo", "image": null, "intent": "i_build", "label": "「THE LINE Experience」展（リヤド）", "layer": [], "medium": ["m_exhibit"], "motif": ["m_naming"], "primary": "pr_online", "primaryRef": "", "role": "bridge", "shape": null, "showImage": false, "summary": "NEOMがリヤドで開いた《ザ・ライン》の展覧会。大型模型とレンダリングを展示し、設計に関わる建築家12組の名が報じられた。", "type": "exhibit", "urls": [{"title": "Archinect (2023-02-02)", "url": "https://archinect.com/news/article/150337798/oma-peter-cook-morphosis-adjaye-associates-among-firms-showcasing-design-proposals-in-neom-s-recent-the-line-experience-exhibition"}], "why": [], "year": 2022, "yearEnd": 2023, "yearU": false}, {"author": ["ax_084"], "channel": "ch_sns", "coding": "c_none", "color": null, "country": null, "desc": "【流通】designboomの読者投稿欄（2024年4月30日）と作者のInstagram。\n【糸】規則やプログラム：生成AI／巨大構造：線状都市／自前の媒体：読者投稿とアカウント\n作者名はAI-DA。designboomは「NEOMのTHE LINEの対になる、反転した像」と紹介した。自然の風景の代わりに、交通と汚染と化石燃料に満ちた線状の都市を描く。使われた生成AIの名は記事にない。\n古典の延長にある巨大構想に対して、生成AIの画像が批評として返された事例。1969年にスーパースタジオが巨大構造を描いて近代建築を批評したのと同じ向きの操作が、生成AIで行われている。\n【第5章】5-1、5-6-4で論じる。", "era": "e_sns", "groups": ["g_genai"], "id": "x_otherline", "image": null, "intent": "i_nobuild", "label": "AI-DA《THE (OTHER) LINE》", "layer": [], "medium": ["m_ai"], "motif": ["m_calc", "m_mega", "m_self"], "primary": "pr_online", "primaryRef": "", "role": "paper", "shape": null, "showImage": false, "summary": "NEOMの《ザ・ライン》を反転させた像を、生成AIで描いた連作。渋滞と汚染に満ちた線状都市。", "type": "work", "urls": [{"title": "designboom (2024-04-30)", "url": "https://www.designboom.com/art/ai-generated-the-other-line-subversive-counterpart-neom-mirrored-city-04-30-2024/"}], "why": ["w_critique"], "year": 2024, "yearEnd": null, "yearU": false}, {"author": ["ax_086", "ax_087"], "channel": "ch_sns", "coding": "c_none", "color": null, "country": "c_uk", "desc": "【流通】ウェブ媒体（KooZA/rchなど）と雑誌。\n【糸】フォトモンタージュ：コラージュ／ドローイング：図面を窓ではなく世界をつくる手段とみなす／自前の媒体：ドローイングを載せるウェブ媒体\nサム・ジェイコブは『Metropolis』（2017年3月21日）で、過去20年のデジタル・レンダリングの文化がドローイングをほとんど殺しかけたと述べ、「擬似的な写実を目指すのではなく、その人工性を探り、使う」ドローイングの復活を論じた。Fala Atelier、Point Supreme、OFFICE KGDVS、Dogmaを挙げ、OMA、リベスキンド、ザハ・ハディドを「紙の建築家」の先例として挙げている。\nKooZA/rchは、建築家フェデリカ・ソフィア・ザンベレッティが始めたウェブ媒体で、「AAでつくられるような美しいドローイング」を見せる場として始まった（Metropolis、2017年3月28日。記事は「3年前」に始めたとする）。\n【要確認】この傾向の流通にInstagramが占めた比重は、上の2記事からは確認できない。図では「ネオ・アンビルト」に置くが、SNS上の流通を示す資料を補う必要がある。\n【第5章】5-1、5-4-2で論じる。", "era": "e_sns", "groups": ["g_cgsns", "g_aa"], "id": "x_postdigital", "image": null, "intent": "i_nobuild", "label": "ポスト・デジタル・ドローイング（サム・ジェイコブ／KooZA/rch）", "layer": [], "medium": ["m_digital"], "motif": ["m_montage", "m_drawing", "m_self"], "primary": "pr_online", "primaryRef": "", "role": "paper", "shape": null, "showImage": false, "summary": "写真のようなレンダリングへの反動として、コラージュや線画に戻る傾向。2017年にサム・ジェイコブが名づけた。", "type": "movement", "urls": [{"title": "Metropolis: Architecture Enters the Age of Post-Digital Drawing (2017-03-21)", "url": "https://metropolismag.com/projects/architecture-enters-age-post-digital-drawing/"}, {"title": "Metropolis: Inside the Digital Platform Championing Post-Digital Drawing (2017-03-28)", "url": "https://metropolismag.com/viewpoints/inside-digital-platform-championing-post-digital-drawing/"}], "why": ["w_dream"], "year": 2017, "yearEnd": null, "yearU": false}, {"author": [], "channel": "ch_sns", "coding": "c_none", "color": null, "country": null, "desc": "【第3章】3-1、3-5(1)「前史」で扱った語。\n【流通】ウェブと新聞のコラム、SNS。\n【糸】CG・映像：写真のように描く\n2015年3月、オランダの設計事務所LEVSのマリアンネ・ローフは、磨き上げたCGの影響を論じた『フォルクスクラント』紙の記事のあとに「レンダリングポルノ（rendering porn）」という語が広まったと書いた。ローフはこの語を「下品だが多くを語る」と評し、最初から「すべてが美しく完璧すぎる像」に設計が閉じ込められる危険を指摘した。\n『Kinfolk』42号（ジョージ・アプトン「Dream House」）は、実在しない建築を写真のように描く像が「renderporn」と呼ばれるようになったと書き、クリスタ・キムの《Mars House》の売却（2021年3月）から書き起こしている。\n語の使われ方は、建つ予定の建物の像への批判（2015）から、建つ予定のない像の呼び名（2021ごろ）へ広がった。生成AIの画像は、この呼び名がすでにある状況に現れた。\n第3章はこの語を2010年代後半のものとして扱っており、図の年（2015年）と矛盾しない。【要確認】『フォルクスクラント』の元記事は未確認。『Kinfolk』の記事は冒頭のみ確認（全文は購読者向け）。\n【第5章】5-1、5-4-2で論じる。", "era": "e_sns", "groups": ["g_cgsns"], "id": "x_renderporn", "image": null, "intent": "i_both", "label": "「レンダリングポルノ」と呼ばれた建築CG", "layer": [], "medium": ["m_digital"], "motif": ["m_render"], "primary": "pr_online", "primaryRef": "", "role": "paper", "shape": null, "showImage": false, "summary": "写真のように仕上げた建築CGを指す呼び名（renderporn）。はじめは開発計画の完成予想図への批判として使われ、のちにSNS上の建たない空間のCGを指す語にもなった。", "type": "event", "urls": [{"title": "LEVS architecten: Rendering porn or love for buildings (2015-03-04)", "url": "https://www.levs.nl/en/news/rendering-porn-or-love-for-buildings"}, {"title": "Kinfolk Issue 42: Dream House", "url": "https://www.kinfolk.com/stories/dream-house/"}], "why": [], "year": 2015, "yearEnd": null, "yearU": false}, {"author": ["ax_085"], "channel": "ch_sns", "coding": "c_none", "color": null, "country": "cx_08", "desc": "【流通】Instagramのアカウントが投稿し、TikTok・X・Facebookに広がった。\n【糸】規則やプログラム：生成AI／超高層：高さ350mの上の競技場／自前の媒体：アカウント\n2025年10月末、超高層の上のサッカー場の動画が「サウジアラビアの2034年ワールドカップの競技場」として拡散した。AFPの検証によれば、つくったのは未来的なスタジアムの生成AI画像を投稿するInstagramアカウント「hyporaultraworks」で、作者はサウジアラビアの計画を知らずにつくったと述べた。作者は5,000万回以上再生されたとしている。フランスの複数の報道機関が公式の案として報じ、のちに記事を削除または修正した（AFP配信、Dhaka Tribune掲載）。\nザ・ラインには実際に、高さ350mの位置に競技場を置く計画がある。関係者はAFPに、拡散した像は「サウジアラビアが計画しているどれにも似ていない」と述べた。\n建たない巨大構想（古典の延長）の公式の像と、生成AIの像とが、受け手の側で区別されなかった事例。\n【要確認】AFPの配信原文と日付（2025年10月末〜11月初め）は未確認。再生数は作者の自己申告。\n【第5章】5-1、5-6-4で論じる。", "era": "e_sns", "groups": ["g_genai", "g_gulf"], "id": "x_skystadium", "image": null, "intent": "i_nobuild", "label": "「スカイ・スタジアム」の生成AI動画", "layer": [], "medium": ["m_ai", "m_film"], "motif": ["m_calc", "m_tower", "m_self"], "primary": "pr_online", "primaryRef": "", "rol /* ================= 自動の糸：珍しい弱い糸を多く共有するノード同士を点線で結ぶ ================= */
// 重み＝そのタグの珍しさ（多くのノードが持つタグほど軽い）。各ノードから、似ている上位K本だけを引く
function autoPairs() {
  const K = S.autoK ?? 1; if (!K) return [];
  const vis = [...nodes.values()].filter(n => n.role !== 'hold' && isNodeVisible(n));
  const mk = n => vals(n, 'motif').filter(m => { const v = vById('motif', m); return v && v.visible !== false; });
  const df = new Map(); vis.forEach(n => mk(n).forEach(m => df.set(m, (df.get(m) || 0) + 1)));
  const NN = vis.length || 1, w = m => Math.log((NN + 1) / (df.get(m) || 1));
  const vec = new Map(vis.map(n => [n.id, mk(n)]));
  const nrm = new Map(vis.map(n => [n.id, Math.sqrt(vec.get(n.id).reduce((a, m) => a + w(m) ** 2, 0)) || 1]));
  const best = new Map();
  for (let i = 0; i < vis.length; i++) for (let j = i + 1; j < vis.length; j++) {
    const a = vis[i], b = vis[j];
    if (S.autoCross && a.era === b.era) continue;
    const vb = vec.get(b.id), sh = vec.get(a.id).filter(m => vb.includes(m)); if (!sh.length) continue;
    const sc = sh.reduce((acc, m) => acc + w(m) ** 2, 0) / (nrm.get(a.id) * nrm.get(b.id));
    if (sc < (S.autoMin ?? 0.35)) continue;
    for (const [x, y] of [[a, b], [b, a]]) { if (!best.has(x.id)) best.set(x.id, []); best.get(x.id).push({ o: y.id, s: sc, sh }); }
  }
  const seen = new Set(), out = [];
  for (const [id, arr] of best) {
    arr.sort((p, q) => q.s - p.s);
    for (const r of arr.slice(0, K)) { const key = [id, r.o].sort().join('|'); if (seen.has(key)) continue; seen.add(key); out.push({ a: id, b: r.o, s: r.s, sh: r.sh.slice().sort((p, q) => w(q) - w(p)) }); }
  }
  return out;
}

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#tview').classList.contains('show')) closeTable(); });
  $('#optLegend').onchange = e => { S.style.exportLegend = e.target.checked; persistSettings(); updateLegend(); };
  $('#fileImport').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await importJson(f); };
  document.addEventListener('click', e => { if (!e.target.closest('.menuwrap')) closeMenus(); });
  const search = $('#search');
  search.addEventListener('input', debounce(refreshHighlight, 120));
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const hits = cy.$('node.match'); if (hits.length) cy.animate({ fit: { eles: hits, padding: 90 } }, { duration: 250 }); }
    if (e.key === 'Escape') { search.value = ''; refreshHighlight(); }
  });
  $('#tabLegend').onclick = () => { $('#tabLegend').setAttribute('aria-selected', 'true'); $('#tabStyle').setAttribute('aria-selected', 'false'); $('#legend').hidden = false; $('#stylePanel').hidden = true; };
  $('#tabStyle').onclick = () => { $('#tabStyle').setAttribute('aria-selected', 'true'); $('#tabLegend').setAttribute('aria-selected', 'false'); $('#legend').hidden = true; $('#stylePanel').hidden = false; };
  $('#btnLeft').onclick = () => { document.body.classList.toggle('show-left'); document.body.classList.remove('show-right'); };
  $('#btnRight').onclick = () => { document.body.classList.toggle('show-right'); document.body.classList.remove('show-left'); };
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement?.tagName || '').toLowerCase();
    const typing = ['input', 'textarea', 'select'].includes(tag) || document.activeElement?.isContentEditable;
    const modalOpen = $('#modal').classList.contains('show');
    if (e.key === 'Escape') { if (modalOpen) { if (!typing) closeModal(); return; } if (edgeMode.on) exitEdgeMode(); else if (!typing) cy.elements().unselect(); closeMenus(); }
    if (!typing && !modalOpen && !VIEW.on && (e.key === 'Delete' || e.key === 'Backspace')) { if (cy.$(':selected').not(HELPER).length) { e.preventDefault(); deleteSelection(); } }
  });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', debounce(() => { refreshAll({ keep: true }); relayoutSoft(); }, 250));
  window.addEventListener('resize', debounce(() => cy.resize(), 150));
}

/* ================= init ================= */

/* ---- ほかのタブ・端末や、Claudeによる変更を取り込む ---- */
const busyPath = path => { const q = Store.q.get(path); return !!(q && (q.op || q.running)); };
const anyBusy = () => [...Store.q.values()].some(q => q.op || q.running);
const sameDoc = (a, b) => JSON.stringify(cleanDoc(a)) === JSON.stringify(cleanDoc(b));
let reloadTimer = null;
function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    if (anyBusy() || $('#modal').classList.contains('show') || edgeMode.on) { scheduleReload(); return; }
    const keep = { tab: S.tab, mode: S.mode, zoom: cy.zoom(), pan: Object.assign({}, cy.pan()), sel: cy.$(':selected').map(e => e.id()) };
    const wasEmpty = nodes.size === 0;
    try { await loadDb(); } catch (e) { console.warn('reload failed', e); return; }
    if (!wasEmpty) { S.tab = (keep.tab === 'all' || vById('era', keep.tab)) ? keep.tab : 'all'; S.mode = keep.mode; }
    applySheetVars(); rebuild(true);
    if (wasEmpty) fit(); else { cy.zoom(keep.zoom); cy.pan(keep.pan); keep.sel.forEach(id => cy.getElementById(id).select()); }
    renderAll(); updateStatus();
    if (wasEmpty && nodes.size) toast('データを読み込みました');
  }, 450);
}
function subscribeRemote() {
  if (!db || typeof db.doc !== 'function') return;
  const onErr = e => console.warn('sync stopped', e && e.code);
  const watch = (coll, map, norm) => snap => {
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id;
      if (busyPath(coll + '/' + id)) continue;
      if (ch.type === 'removed') { if (map.has(id)) return scheduleReload(); continue; }
      const cur = map.get(id);
      if (!cur || !sameDoc(cur, norm(Object.assign(structuredClone(ch.doc.data()), { id })))) return scheduleReload();
    }
  };
  try {
    db.collection('nodes').limit(1000).onSnapshot(watch('nodes', nodes, normNode), onErr);
    db.collection('edges').limit(1000).onSnapshot(watch('edges', edges, normEdge), onErr);
    db.doc('meta/settings').onSnapshot(snap => {
      if (!snap.exists || busyPath('meta/settings')) return;
      const remote = mergeSettings(structuredClone(snap.data()));
      const local = Object.assign({}, S, { tab: remote.tab, mode: remote.mode });
      if (!sameDoc(remote, local)) scheduleReload();
    }, onErr);
  } catch (e) { console.warn('subscribe failed', e); }
}
// スマートフォン：下から出る詳細欄を、下にスワイプして閉じる
function bindSheetSwipe() {
  const el = $('#inspector'); let y0 = null, dy = 0;
  el.addEventListener('touchstart', e => {
    if (!isNarrow() || !document.body.classList.contains('show-right')) return;
    if (!(e.target.closest('.grab') || el.scrollTop <= 0)) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; el.style.transition = 'none';
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || (el.scrollTop > 0 && !e.target.closest('.grab'))) { if (dy <= 0) { el.style.transform = ''; } else { y0 = null; el.style.transform = ''; el.style.transition = ''; } return; }
    el.style.transform = `translateY(${dy}px)`; if (e.cancelable) e.preventDefault();
  }, { passive: false });
  const end = () => {
    if (y0 == null) return;
    el.style.transition = ''; el.style.transform = '';
    if (dy > 70) { document.body.classList.remove('show-right'); if (cy) cy.elements().unselect(); }
    y0 = null; dy = 0;
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
}
async function init() {
  if (typeof window.cytoscape !== 'function') { setStatus('図の部品を読み込めませんでした。再読み込みしてください', 'err'); return; }
  cy = cytoscape({ container: $('#cy'), elements: [], style: buildStyle(), wheelSensitivity: 0.35, minZoom: 0.06, maxZoom: 5, boxSelectionEnabled: true, selectionType: 'single' });
  bindCy(); bindUi(); renderAll(); bindSheetSwipe();
  const c = null; // 公開用：データベースを使わない
  let user = null;
  if (c && typeof c.use === 'function') { const [d, a, dl, u] = await Promise.all(['db', 'assets', 'downloads', 'user'].map(n => c.use(n).catch(() => null))); db = d; assets = a; downloads = dl; user = u; }
  // 編集できるのは、このアーティファクトの編集権限がある人（持ち主を含む）だけ。それ以外の人と、QRコードから開いた人は閲覧専用
  VIEW.canEdit = false;
  const wantView = hashWantsView() || !VIEW.canEdit;
  $('#btnExitView').classList.toggle('nope', !VIEW.canEdit);
  if (db) { try { await loadDb(); Store.mode = 'db'; } catch (err) { console.warn('db load failed', err); db = null; } }
  if (!db || (wantView && nodes.size === 0)) {
    let snap = null; try { snap = JSON.parse($('#snapshot').textContent || 'null'); } catch (e) { snap = null; }
    if (wantView && snap && Array.isArray(snap.nodes)) { applyImported(snap); Store.mode = 'view';
      // 公開用の固定設定：グループ配置のみ、第2章は古典と古典の終わりのみ、強調なしで開く
      S.title = 'アンビルト関係図'; S.mode = 'group'; S.crossLinks = true; S.preOnlyClassic = true; S.spot = null; S.tab = 'all'; }
    else if (!db) { loadLocal(); Store.mode = 'local'; }
  }
  if (wantView) {
    VIEW.on = true; VIEW.prev = { mode: Store.mode === 'view' ? (db ? 'db' : 'local') : Store.mode, readOnly: Store.readOnly };
    Store.mode = 'view'; Store.readOnly = true;
    document.body.classList.add('viewmode'); cy.autoungrabify(true); cy.boxSelectionEnabled(false);
  }
  applySheetVars(); rebuild(); renderAll(); updateStatus();
  if (db && (Store.mode === 'db' || VIEW.on)) subscribeRemote();
  ensureFonts().then(() => { fit(); const id = hashNodeId(); if (VIEW.on && id) focusNode(id, isNarrow() ? 'center' : 'fit'); });
}
init();
})();
