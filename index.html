<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アンビルト関係図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#DCDED8; --panel:#F7F7F3; --panel-2:#ECEDE7; --ink:#24272C; --ink-2:#585E65; --ink-3:#8A8F95;
  --rule:#CBCEC6; --accent:#2B4E7E; --accent-ink:#FFFFFF; --danger:#9B2C2C; --warn:#8A5A00;
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sheet-bg:#FBFBF7; --sheet-ink:#24272C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1A1C1F; --panel:#23262A; --panel-2:#2C3035; --ink:#E6E7E3; --ink-2:#A8ADB3; --ink-3:#7C8289;
    --rule:#3A3F45; --accent:#8DB0DE; --accent-ink:#0F213A; --danger:#E08A8A; --warn:#E0B060; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#1A1C1F; --panel:#23262A; --panel-2:#2C3035; --ink:#E6E7E3; --ink-2:#A8ADB3; --ink-3:#7C8289;
  --rule:#3A3F45; --accent:#8DB0DE; --accent-ink:#0F213A; --danger:#E08A8A; --warn:#E0B060; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule);flex-wrap:wrap;position:relative;z-index:5}
.title{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.06em;margin:0 10px 0 2px;white-space:nowrap}
.grow{flex:1}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:5px 10px;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--rule))}
.btn.small{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 11px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:5px 9px;width:170px}
.status{font-size:12px;color:var(--ink-3);white-space:nowrap}
.status.err{color:var(--danger)} .status.warn{color:var(--warn)}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;min-width:250px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);padding:5px;display:none;z-index:30}
.menu.right{left:auto;right:0}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px}
.menu button:hover{background:var(--panel-2)}
.menu button[aria-checked="true"]::after{content:"　✓";color:var(--accent)}
.menu .chk{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.menu .chk input{margin:0;accent-color:var(--accent)}
.menu .note{font-size:11px;color:var(--ink-3);padding:4px 10px 6px}
.menu .mh{font-size:11px;color:var(--ink-3);padding:6px 10px 2px}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.only-narrow{display:none}

.work{flex:1;display:grid;grid-template-columns:284px minmax(0,1fr) 344px;min-height:0;position:relative}
.panel{background:var(--panel);overflow:auto;min-height:0}
.panel.left{border-right:1px solid var(--rule)}
.panel.right{border-left:1px solid var(--rule)}
.tabs{display:flex;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;background:none;padding:9px 0;color:var(--ink-2);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
details.sec{border-bottom:1px solid var(--rule)}
details.sec>summary{list-style:none;padding:10px 14px 8px;cursor:pointer;display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-weight:600;font-size:14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);margin-right:2px;transition:transform .15s;align-self:center}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>summary .hint{font-family:var(--ui);font-weight:400;font-size:11px;color:var(--ink-3)}
details.sub{margin:0 10px 4px 14px;border-left:1px solid var(--rule)}
details.sub>summary{list-style:none;cursor:pointer;padding:4px 8px;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary .hint{font-size:11px;color:var(--ink-3)}
.secbody{padding:0 0 10px}
.row{display:grid;grid-template-columns:18px 22px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:2px 10px 2px 14px}
.row.type{grid-template-columns:18px 22px minmax(0,1fr) 74px auto}
details.sub .row{padding-left:8px}
.row input[type=checkbox]{margin:0;width:15px;height:15px;accent-color:var(--accent)}
input[type=color]{width:22px;height:22px;border:1px solid var(--rule);border-radius:4px;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}
.row input.name{border:1px solid transparent;background:transparent;padding:2px 5px;border-radius:4px;min-width:0;width:100%}
.row input.name:hover{border-color:var(--rule)}
.row input.name:focus{border-color:var(--accent);background:var(--panel);outline:none}
.row .namebtn{border:1px solid transparent;background:none;text-align:left;padding:2px 5px;border-radius:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .namebtn:hover{border-color:var(--rule)}
.row select{font-size:11px;border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:1px 2px;width:100%}
.count{color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;min-width:18px;text-align:right}
.count.over{color:var(--danger);font-weight:700}
.icon{border:0;background:none;color:var(--ink-3);padding:0 3px;font-size:13px;line-height:1}
.icon:hover{color:var(--ink)}
.icon.del:hover{color:var(--danger)}
.addrow{margin:6px 14px 0;border:1px dashed var(--rule);background:none;border-radius:6px;padding:4px 8px;color:var(--ink-2);font-size:12px}
.addrow:hover{border-color:var(--ink-3);color:var(--ink)}
.linesample{width:22px;height:10px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:4px 14px}
.opt label{color:var(--ink-2);font-size:12px}
.opt select,.opt input[type=text],.opt input[type=number]{border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:3px 6px;font-size:12px;max-width:160px}
.optr{display:grid;grid-template-columns:1fr 120px 34px;align-items:center;gap:6px;padding:4px 14px}
.optr label{color:var(--ink-2);font-size:12px}
.optr input[type=range]{width:120px;accent-color:var(--accent)}
.optr .val{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;padding:2px 14px 6px}
.checks label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.checks input{accent-color:var(--accent);margin:0}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 14px 8px}
.presets button{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:8px 4px 6px;font-size:12px;display:grid;justify-items:center;gap:5px}
.presets button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.presets svg{width:52px;height:30px}
.curves{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 14px 6px}
.curves button{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:5px 2px 3px;font-size:10.5px;display:grid;justify-items:center;gap:2px;color:var(--ink-2)}
.curves button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.curves svg{width:36px;height:22px}

.sheet{position:relative;min-width:0;min-height:0}
.eratabs{position:absolute;left:16px;right:16px;top:8px;height:34px;display:flex;align-items:flex-end;gap:3px;z-index:3;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.eratabs button{border:1px solid var(--rule);border-bottom:0;background:var(--panel-2);color:var(--ink-2);padding:6px 12px 7px;border-radius:7px 7px 0 0;display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.eratabs button[aria-selected="true"]{background:var(--sheet-bg);color:var(--sheet-ink);font-weight:700;box-shadow:0 -1px 0 1px rgba(0,0,0,.04);position:relative;top:1px;padding-bottom:8px}
.eratabs .n{font-size:11px;color:var(--ink-3);font-weight:400}
.eratabs .grow{flex:1}
.eratabs .cross{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px;padding-bottom:7px;white-space:nowrap}
.eratabs .cross input{margin:0;accent-color:var(--accent)}
.paper{position:absolute;inset:42px 16px 16px;background:var(--sheet-bg);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 14px 34px -18px rgba(0,0,0,.45)}
#cy{position:absolute;inset:0}
.crop{position:absolute;width:12px;height:12px;border-color:var(--ink-3);border-style:solid;opacity:.7;pointer-events:none}
.crop.tl{top:-9px;left:-9px;border-width:0 1px 1px 0}
.crop.tr{top:-9px;right:-9px;border-width:0 0 1px 1px}
.crop.bl{bottom:-9px;left:-9px;border-width:1px 1px 0 0}
.crop.br{bottom:-9px;right:-9px;border-width:1px 0 0 1px}
.titleblock{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:auto auto;border:1px solid color-mix(in srgb,var(--sheet-ink) 55%,transparent);color:var(--sheet-ink);background:color-mix(in srgb,var(--sheet-bg) 90%,transparent);font-size:10.5px;line-height:1.3;pointer-events:none}
.titleblock div{padding:3px 8px;border-right:1px solid color-mix(in srgb,var(--sheet-ink) 30%,transparent);border-bottom:1px solid color-mix(in srgb,var(--sheet-ink) 30%,transparent)}
.titleblock div:nth-child(2n){border-right:0}
.titleblock div:nth-last-child(-n+2){border-bottom:0}
.titleblock .k{color:color-mix(in srgb,var(--sheet-ink) 55%,transparent)}
.titleblock .name{font-family:var(--serif);font-size:13px;font-weight:600}
.titleblock .over{color:#9B2C2C;font-weight:700}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:6px 8px 6px 14px;border-radius:999px;display:none;align-items:center;gap:10px;z-index:4;font-size:12.5px;box-shadow:0 6px 20px -8px rgba(0,0,0,.4)}
.banner.show{display:flex}
.banner button{border:0;background:color-mix(in srgb,var(--accent-ink) 18%,transparent);color:inherit;border-radius:999px;padding:3px 10px}
.empty{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.empty.show{display:grid}
.empty p{max-width:34em;text-align:center;color:color-mix(in srgb,var(--sheet-ink) 60%,transparent);line-height:1.8;font-size:13px}
.tip{position:absolute;pointer-events:none;max-width:310px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.55;box-shadow:0 8px 24px -10px rgba(0,0,0,.35);display:none;z-index:6}
.tip b{display:block;font-size:12.5px;margin-bottom:2px}
.tip .y{color:var(--ink-3);font-size:11px}

.insp-head{padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.insp-head .kind{font-size:11px;color:var(--ink-3)}
.insp-head h2{margin:2px 0 0;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.4;word-break:break-word}
.completeness{margin-top:6px;font-size:11.5px;color:var(--ink-2)}
.completeness .bad{color:var(--danger)}
.field{display:grid;gap:5px;padding:7px 16px}
.field>label,.field>.lab{font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;align-items:baseline}
.field>.lab .req{color:var(--ink-3);font-size:10.5px}
.field.missing>.lab{color:var(--danger)}
.field.missing>.lab::after{content:"未入力";font-size:10.5px;border:1px solid currentColor;border-radius:3px;padding:0 4px}
.field input[type=text],.field input[type=number],.field input[type=url],.field select,.field textarea{width:100%;border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:6px 8px}
.field textarea{resize:vertical;line-height:1.65;min-height:44px}
.field textarea.long{min-height:120px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:12px;line-height:1.55;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.chip:hover{border-color:var(--ink-3)}
.chip .sw{width:8px;height:8px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.und{border-style:dashed;color:var(--ink-2)}
.chip.und[aria-pressed="true"]{color:var(--panel)}
.chip.add{border-style:dashed;color:var(--ink-3);background:none}
.chipinput{border:1px solid var(--accent);border-radius:999px;padding:2px 9px;font-size:12px;width:140px;background:var(--panel);outline:none}
.yearrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.links{display:grid;gap:4px}
.linkrow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto auto;gap:4px;align-items:center}
.linkrow input{padding:4px 6px!important;font-size:12px}
.linkrow a{color:var(--accent);text-decoration:none;padding:0 3px}
.thumb{width:100%;max-height:180px;object-fit:contain;background:var(--panel-2);border:1px solid var(--rule);border-radius:5px}
.conn{display:grid;gap:2px}
.conn button{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:0;background:none;padding:4px 6px;border-radius:5px;font-size:12px}
.conn button:hover{background:var(--panel-2)}
.conn .dot{width:10px;height:3px;border-radius:2px}
.conn .sub{color:var(--ink-3);font-size:11px}
details.look{margin:4px 16px;border:1px solid var(--rule);border-radius:6px}
details.look>summary{cursor:pointer;padding:6px 10px;font-size:12px;color:var(--ink-2)}
details.look .field{padding:4px 10px 10px}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 20px}
.help{padding:14px 16px;color:var(--ink-2);font-size:12.5px;line-height:1.75}
.help h3{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);margin:4px 0 6px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0 14px}
.help dt{color:var(--ink);white-space:nowrap}
.help dd{margin:0}
.help .stat{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-bottom:14px}
.help .stat b{font-variant-numeric:tabular-nums;color:var(--ink)}
.help .stat b.over{color:var(--danger)}
.endpoint{border:0;background:none;padding:0;color:var(--accent);text-align:left;font:inherit;text-decoration:underline;text-underline-offset:2px}
.muted{color:var(--ink-3);font-size:11px}

.modal{position:fixed;inset:0;background:rgba(10,12,15,.42);display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid}
.dialog{background:var(--panel);border:1px solid var(--rule);border-radius:10px;max-width:560px;width:100%;max-height:88%;overflow:auto;padding:18px 18px 14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.dialog.wide{max-width:680px;padding:0}
.hpick{padding:4px 14px 8px}
.hpick .hh{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.hpick .lnk{border:0;background:none;color:var(--accent);padding:0;font-size:12px;cursor:pointer}
.hpick .hf{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-2);margin-top:6px}
.hpick .hf input{margin:0}
.spotbox{padding:6px 14px 8px;border-top:1px solid var(--rule);margin-top:4px}
.spotbox .hh{font-size:12px;color:var(--ink-2);margin-bottom:4px}
.spotrow{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.spotrow select{flex:1;min-width:0;border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:3px 6px;font-size:12px}
.spotbox .muted{margin-top:2px;line-height:1.5}
.spotchips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.spotchip{border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:12px;padding:2px 8px;font-size:11.5px;line-height:1.5;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.spotchip:hover{border-color:var(--ink-3)}
.spotchip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.spotchip.sub .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-block;flex:none}
.spotchip.sub.on{background:var(--panel);color:var(--ink);border:2px solid var(--hl);font-weight:600;padding:1px 7px}
.spotchip.sub.on .dot{background:var(--hl);border-color:var(--hl)}
.spotsub{margin-top:4px;padding-top:6px;border-top:1px dashed var(--rule)}
.thm{padding:6px 14px 6px}
.thm .tt{display:flex;gap:6px;align-items:center;font-size:12.5px}
.thm .tt i{width:10px;height:10px;border-radius:3px;display:inline-block}
.thm .tt .count{margin-left:auto}
.thm .td{font-size:11.5px;color:var(--ink-2);margin:2px 0 0 16px;line-height:1.5}
.thm .tk{font-size:11px;color:var(--ink-3);margin:2px 0 0 16px}
.minfo{margin:2px 0 10px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--panel-2);font-size:12px}
.minfo .mh{font-weight:700;margin-bottom:4px}
.minfo .mi{margin:5px 0}
.minfo .mi i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.minfo .mt{margin-left:8px;color:var(--ink-3);font-size:11px}
.minfo .md{color:var(--ink-2);margin:2px 0 0 16px;line-height:1.5}
.tview{position:fixed;inset:0;z-index:60;background:var(--panel);display:none;flex-direction:column}
.tview.show{display:flex}
.tview .th{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--panel)}
.tview .th h2{font-size:16px;margin:0 8px 0 0}
.tview .seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.tview .seg button{border:0;background:var(--panel-2);padding:6px 11px;font-size:12.5px;color:var(--ink-2)}
.tview .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tview .tb{flex:1;overflow:auto;padding:14px 16px 30px}
.tview table{border-collapse:collapse;width:100%;min-width:980px;font-size:12.5px;background:var(--sheet-bg);color:var(--sheet-ink)}
.tview th,.tview td{border:1px solid var(--rule);padding:6px 8px;vertical-align:top;text-align:left}
.tview th{background:var(--panel-2);font-weight:700;position:sticky;top:0;z-index:1}
.tview td.no{text-align:center;white-space:nowrap;font-weight:700;color:#fff}
.tview td.yr{white-space:nowrap}
.tview .cap{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.tview .keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:8px 0 0}
.tview .keys i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.dialog.wide .dh{padding:16px 18px 8px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:1}
.dialog.wide .db{padding:6px 2px}
.dialog.wide .df{padding:10px 18px 14px;border-top:1px solid var(--rule);position:sticky;bottom:0;background:var(--panel);display:flex;align-items:center;gap:10px}
.dialog h3{margin:0 0 6px;font-family:var(--serif);font-size:16px;font-weight:600}
.dialog p{margin:0 0 12px;color:var(--ink-2);line-height:1.7}
.dialog .dh p{margin:0;font-size:12px}
.dialog input[type=text]{width:100%;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 9px;margin-bottom:10px}
.dialog textarea{width:100%;min-height:90px;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:8px;margin-bottom:10px}
.dialog textarea.code{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:var(--panel-2)}
.dialog img{max-width:100%;border:1px solid var(--rule)}
.dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.dialog .lbl{font-size:11.5px;color:var(--ink-2);display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}

@media (max-width: 980px){
  .only-narrow{display:inline-block}
  .work{grid-template-columns:minmax(0,1fr)}
  .panel.left{position:absolute;top:0;bottom:0;left:0;width:min(88vw,320px);z-index:8;transform:translateX(-102%);transition:transform .2s;box-shadow:12px 0 30px -18px rgba(0,0,0,.5)}
  .panel.right{position:absolute;left:0;right:0;bottom:0;max-height:66%;z-index:8;transform:translateY(102%);transition:transform .2s;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -12px 30px -18px rgba(0,0,0,.5)}
  body.show-left .panel.left{transform:none}
  body.show-right .panel.right{transform:none}
  .paper{inset:40px 8px 8px}
  .eratabs{left:8px;right:8px}
  .eratabs .cross{display:none}
  .crop{display:none}
  .search{width:120px}
  .titleblock{display:none}
  .title{font-size:16px}
  .eratabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .eratabs::-webkit-scrollbar{display:none}
}

/* ---- 閲覧専用の表示（QRコードから開く） ---- */
.view-only{display:none!important}
body.viewmode .view-only{display:inline-block!important}
body.viewmode .view-only.nope{display:none!important}
body.viewmode .edit-only{display:none!important}
body.viewmode .panel.left .tabs{display:none}
body.viewmode .eratabs .cross{display:none}
body.viewmode .status{display:none}
body.viewmode .titleblock{display:none!important}
.figlg{position:absolute;top:8px;right:8px;z-index:4;max-width:min(200px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;background:color-mix(in srgb,var(--sheet-bg) 94%,transparent);color:var(--sheet-ink);border:1px solid var(--rule);border-radius:8px;box-shadow:0 6px 18px -10px rgba(0,0,0,.35);font-size:11.5px;line-height:1.45}
.figlg .fh{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:6px 10px;font-weight:700;font-size:12px;color:inherit}
.figlg .fh .ch{font-weight:400;color:var(--ink-3)}
.figlg .fb{padding:0 10px 8px;display:grid;gap:7px}
.figlg .ft{font-size:10.5px;color:var(--ink-3);margin-bottom:1px}
.figlg .fr{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;align-items:center}
.figlg .fr i{width:13px;height:13px;border-radius:3px;display:block;justify-self:center}
.figlg .fr svg{width:26px;height:10px}
.figlg .tg{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:3px;font-size:9.5px;font-weight:700;font-style:normal;margin-right:2px}
.grab{display:none}
@media (max-width: 980px){
  body.viewmode .grab{display:block;position:sticky;top:0;height:20px;margin-bottom:-6px;background:var(--panel);z-index:3;touch-action:none}
  body.viewmode .grab::before{content:"";position:absolute;left:50%;top:7px;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:var(--rule)}
  .figlg{font-size:11px;max-width:min(230px,calc(100% - 16px))}
}
body.viewmode input#search.edit-only{display:inline-block!important}
body.viewmode .eratabs label.cross{display:none!important}
.vpick{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:0 0 8px}
.vpick button{border:0;background:var(--panel);padding:4px 12px;font-size:12.5px}
.vpick button+button{border-left:1px solid var(--rule)}
.vpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.searchhit{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
@media (max-width: 980px){ body.viewmode input#search.edit-only{display:none!important} body.viewmode .eratabs .tl-l{display:none} }
.vbadge{font-size:11px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--ink-2);white-space:nowrap}
.vsec{padding:12px 16px;border-bottom:1px solid var(--rule)}
.vsec h3{margin:0 0 8px;font-family:var(--serif);font-size:14px;font-weight:600}
.vsec p{margin:0 0 6px;color:var(--ink-2);font-size:12.5px;line-height:1.7}
.vrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:3px 0;font-size:12.5px}
.vrow .sw{width:14px;height:14px;border-radius:4px;margin-top:3px}
.vrow .d{color:var(--ink-3);font-size:11.5px;line-height:1.5}
.vmeta{margin-top:4px;font-size:12px;color:var(--ink-2)}
.vtext{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.8;margin:0}
.vthemes{display:grid;gap:6px}
.vtheme{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start}
.vtheme i{width:14px;height:14px;border-radius:50%;margin-top:3px;display:block}
.vtheme b{font-size:13px}
.vtheme .m{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.vconn{display:grid;gap:4px}
.vconn .it{border:1px solid var(--rule);border-radius:8px;padding:7px 9px;display:grid;gap:3px}
.vconn .it button.go{border:0;background:none;padding:0;text-align:left;font-size:13.5px;font-weight:700;color:var(--accent);display:flex;gap:6px;align-items:baseline}
.vconn .it .rel{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--ink-2)}
.vconn .it .rel svg{width:26px;height:10px;flex:none}
.vconn .it .ed{font-size:12px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap}
.vconn .hh{font-size:11.5px;color:var(--ink-3);margin:6px 0 2px}
.vlinks{display:grid;gap:4px}
.vlinks a{color:var(--accent);word-break:break-all;font-size:12.5px}
.vbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qrbox{display:grid;justify-items:center;gap:10px;margin:6px 0 4px}
.qrbox img{width:min(260px,70vw);height:auto;image-rendering:pixelated;border:1px solid var(--rule);background:#fff}
.qrurl{display:flex;gap:6px;width:100%}
.qrurl input{flex:1;min-width:0;font-size:12px!important;margin:0!important}
.qrseg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:8px}
.qrseg button{border:0;background:var(--panel);padding:5px 11px;font-size:12.5px}
.qrseg button+button{border-left:1px solid var(--rule)}
.qrseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width: 980px){
  body.viewmode .panel.right{height:52%;max-height:52%}
  body.viewmode .bar{gap:6px;padding:6px 10px}
  body.viewmode .title{font-size:15px;margin:0 4px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
}
</style>
</head>
<body>
<header class="bar">
  <button class="btn only-narrow" id="btnLeft" aria-label="検索・色分け・凡例を開く">メニュー</button>
  <h1 class="title" id="appTitle">アンビルト関係図</h1>
  
  <button class="btn primary edit-only" id="btnAddNode" title="項目を選んでノードを追加">＋ ノード</button>
  <button class="btn edit-only" id="btnEdgeMode" title="始点と終点を順にクリックして線を引きます">線でつなぐ</button>
  <div class="seg edit-only" role="group" aria-label="配置">
    <button id="modeTimeline" aria-pressed="false">年表</button>
    <button id="modeGroup" aria-pressed="false">グループ</button>
    <button id="modeFree" aria-pressed="false">自由配置</button>
  </div>
  <div class="menuwrap edit-only">
    <button class="btn" id="btnLayout" aria-haspopup="true">配置の設定</button>
    <div class="menu" id="menuLayout"></div>
  </div>
  <button class="btn" id="btnFit" title="図全体が見えるように表示">全体を表示</button>
  <span class="grow edit-only"></span>
  <input class="search edit-only" id="search" type="search" placeholder="事例を検索" aria-label="ノードを検索">
  <button class="btn edit-only" id="btnTable" title="事例の年代・国・提案者・概要を表にしてスライド用に書き出す">事例の表</button>
  <button class="btn edit-only" id="btnQr" title="スマホで閲覧するためのQRコードを作る">QRコード</button>
  <button class="btn view-only" id="btnExitView" title="閲覧専用の表示をやめて編集に戻る">編集に戻る</button>
  <div class="menuwrap edit-only">
    <button class="btn" id="btnExport" aria-haspopup="true">書き出し</button>
    <div class="menu right" id="menuExport">
      <button data-act="png">PNG（高解像度の画像）</button>
      <button data-act="pdf">PDF（A3・名前を付けて保存）</button>
      <button data-act="svg">SVG（清書・加工用のベクター）</button>
      <hr>
      <button data-act="json">JSON（全データのバックアップ）</button>
      <button data-act="import">JSONを読み込む…</button>
      <label class="chk"><input type="checkbox" id="optLegend"> 凡例を図の上に表示する</label>
      <div class="note">書き出されるのは、いま表示されているノードと線、凡例です。背景は白です。凡例は枠をドラッグして動かせます。</div>
    </div>
  </div>
  <span class="status" id="status">読み込み中…</span>
  <button class="btn only-narrow" id="btnRight" aria-label="詳細を開く">詳細</button>
</header>

<main class="work">
  <aside class="panel left" id="left">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabLegend" aria-selected="true">凡例と項目</button>
      <button role="tab" id="tabStyle" aria-selected="false">スタイル</button>
    </div>
    <div id="legend"></div>
    <div id="stylePanel" hidden></div>
  </aside>

  <section class="sheet">
    <div class="eratabs" id="eraTabs" role="tablist" aria-label="時代区分"></div>
    <div class="paper" id="paper">
      <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
      <div id="cy"></div>
      <div class="empty" id="empty"><p>まだノードがありません。「＋ ノード」から追加します。<br>バックアップがあれば「書き出し」→「JSONを読み込む」から戻せます。</p></div>
      <div class="titleblock" id="titleblock"></div>
      <div class="banner" id="banner"><span id="bannerText"></span><button id="bannerCancel">やめる</button></div>
      <div class="tip" id="tip"></div>
      <div class="figlg" id="figlg" aria-label="凡例"></div>
    </div>
  </section>

  <aside class="panel right" id="inspector"></aside>
</main>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="tview" id="tview" role="dialog" aria-modal="true" aria-label="事例の表"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<input type="file" id="fileImage" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>

 "coding": "c_simple", "color": null, "country": "cx_01", "desc": "【流通】コンペ案として発表され、作品集で広く知られる。\n【糸】審査と落選：建たなかったコンペ案／白紙：海に面した港\nフェリーターミナルとホテルなどを一つの塊に積んだ港のコンペ案。", "era": "e_pre", "groups": ["g_oma"], "id": "k_zeebrugge", "image": null, "intent": "i_build", "label": "OMA《ゼーブルッヘ海上ターミナル》", "layer": [], "medium": ["m_drawing"], "motif": ["m_jury", "m_blank"], "primary": "pr_online", "primaryRef": "【確認済】OMA公式サイト https://www.oma.com/projects/zeebrugge-sea-terminal 、作品集『OMA-Rem Koolhaas: Architecture 1970-1990』（1991）", "role": "cand", "shape": null, "showImage": false, "summary": "フェリーターミナルとホテルなどを一つの塊に積んだ港のコンペ案。", "type": "work", "urls": [], "why": ["w_cond"], "year": 1989, "yearEnd": null, "yearU": false}, {"author": ["ax_018"], "channel": "ch_trad", "coding": "c_simple", "color": null, "country": "cx_02", "desc": "【流通】コンペ当選案として発表された。\n【糸】審査と落選：勝って建たない\n芸術とメディア技術のセンターのコンペに勝ちながら、建たなかった案。", "era": "e_pre", "groups": ["g_oma"], "id": "k_zkm", "image": null, "intent": "i_build", "label": "OMA《ZKMカールスルーエ》", "layer": [], "medium": ["m_drawing"], "motif": ["m_jury"], "primary": "pr_book", "primaryRef": "【確認済】作品集『OMA-Rem Koolhaas: Architecture 1970-1990』（1991）、『S,M,L,XL』（1995）", "role": "cand", "shape": null, "showImage": false, "summary": "芸術とメディア技術のセンターのコンペに勝ちながら、建たなかった案。", "type": "work", "urls": [], "why": ["w_cond"], "year": 1989, "yearEnd": 1992, "yearU": false}, {"author": ["a_kudan"], "channel": "ch_ext", "coding": "c_simple", "color": null, "country": "c_jp", "desc": "【流通】小説として発表され、第170回芥川賞を受賞（2024年1月）。16か国での翻訳が決まり、海外でも評価された。\n【糸】文章で語る：図面も絵もない、言葉だけの建築／スター建築家：撤回されたザハの新国立競技場が建った世界を舞台にする／超高層：犯罪者を収容する塔「シンパシータワートーキョー」\n主人公の建築家・牧名沙羅が、新しい刑務所の塔のコンペに参加する。著者は受賞会見で、全体の約5%に生成AIの文章を使ったと述べた（作中に登場する生成AIの応答の部分）。アンビルトが小説の題材になった例として重要。\n【第5章】5-6-3で論じる。", "era": "e_sns", "groups": [], "id": "l_dojoto", "image": null, "intent": "i_nobuild", "label": "九段理江『東京都同情塔』", "layer": ["l_b", "l_e"], "medium": ["m_print"], "motif": ["m_text", "m_name", "m_tower"], "primary": "pr_book", "primaryRef": "【確認済】九段理江『東京都同情塔』新潮社、2024年（第170回芥川賞受賞作）", "role": "paper", "shape": null, "showImage": false, "summary": "ザハの新国立競技場が建った「もうひとつの東京」で、建築家が刑務所の塔を設計する小説。図面も絵もない、言葉だけのアンビルト。", "type": "media", "urls": [{"title": "新潮社：『東京都同情塔』紹介", "url": "https://www.shinchosha.co.jp/bunko/blog/2026/05/15_1.html"}], "why": ["w_dream"], "year": 2023, "yearEnd": 2024, "yearU": false}, {"author": ["a_archigram"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_uk", "desc": "【流通】自主刊行の雑誌『アーキグラム』（1961年〜）。1960年のMoMA展には、のちのメンバーのマイケル・ウェッブが出品。日本には『建築の解体』で紹介。\n【糸】巨大構造：都市規模の構造／可変：差し替えられ、歩く都市／フォトモンタージュ：コラージュ\nピーター・クック《プラグイン・シティ》、ロン・ヘロン《ウォーキング・シティ》。雑誌『Archigram』(1961–74) を通じて流通した。", "era": "e_pre", "groups": ["g_aa", "g_kaitai"], "id": "n_archigram", "image": null, "intent": "i_nobuild", "label": "アーキグラム《プラグイン・シティ》《ウォーキング・シティ》", "layer": ["l_c"], "medium": ["m_drawing", "m_collage", "m_print"], "motif": ["m_mega", "m_metab", "m_montage"], "primary": "pr_online", "primaryRef": "【確認済】Archigram Archival Project（ウェストミンスター大学、約1万点を公開） http://archigram.westminster.ac.uk", "role": "paper", "shape": null, "showImage": false, "summary": "移動し差し替えられる巨大構造の都市を、自主刊行の雑誌とコラージュで広めた。", "type": "work", "urls": [], "why": ["w_dream"], "year": 1964, "yearEnd": null, "yearU": false}, {"author": ["a_boullee"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_fr", "desc": "【糸】巨大構造：地球のような球体／名づけ：20世紀半ばに「幻視の建築」として名づけ直された\n【前史・図には載せない】18世紀末の革命期の建築家たちの構想（ブレのニュートン記念堂など）。ブレの建築論は手稿のままで、英語版が1953年、アルド・ロッシによるイタリア語訳が1967年。カウフマン『三人の革命的建築家』（1952）が「幻視の建築家」としてまとめた。20世紀半ばの出版と翻訳で再流通した例として本文で触れる。", "era": "e_pre", "groups": ["__none"], "id": "n_boullee", "image": null, "intent": "i_both", "label": "ブレ、ルドゥーの「幻視の建築」", "layer": [], "medium": ["m_drawing"], "motif": ["m_mega", "m_naming"], "primary": "pr_online", "primaryRef": "【見込み】フランス国立図書館（Gallica）のブレの図面", "role": "hold", "shape": null, "showImage": false, "summary": "18世紀末の幻視の建築家たち。20世紀半ばの出版・翻訳で「建たない建築」の祖として再流通した。", "type": "movement", "urls": [], "why": ["w_dream"], "year": 1784, "yearEnd": 1804, "yearU": false}, {"author": ["a_brodsky"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_ru", "desc": "【流通】日本の建築雑誌が主催するアイデア・コンペ（1982年、東京のセントラル硝子のコンペで1等）。\n【糸】審査と落選：アイデア・コンペで1等／ドローイング：エッチング／言葉：詩のような文章\nソ連の「紙の建築家」。建てられる見込みのない案を、『ジャパン・アーキテクト』誌が毎年開いたアイデア・コンペなどに応募して受賞を重ねた。画像に詩のような文章を添え、ブレやシュプレマティストを振り返る。日本の雑誌が「建たない案だけを競わせる場」を国外に開いていたことを示す。", "era": "e_pre", "groups": ["__none"], "id": "n_crystal", "image": null, "intent": "i_nobuild", "label": "ブロツキー＆ウトキン《クリスタル・パレス》", "layer": ["l_c"], "medium": ["m_drawing"], "motif": ["m_jury", "m_drawing", "m_text"], "primary": "pr_book", "primaryRef": "【見込み】ブロツキー＆ウトキンの作品集（エッチングの複製）、セントラル硝子コンペの入選作発表誌", "role": "paper", "shape": null, "showImage": false, "summary": "野に並ぶガラスの板の宮殿。日本の雑誌が主催するアイデア・コンペで1等を得た「紙の建築」。", "type": "work", "urls": [{"title": "The Moscow Times (2015)", "url": "https://themoscowtimes.com/2015/09/13/avant-garde-architects-brodsky-and-utkin-in-the-spotlight-a49521"}, {"title": "Christian Science Monitor (1994)", "url": "https://csmonitor.com/1994/0127/27102.html"}, {"title": "Faktografia (2012)", "url": "https://faktografia.com/2012/12/28/paper-architecture-the-columbaria-of-brodsky-and-utkin/"}], "why": ["w_critique"], "year": 1982, "yearEnd": null, "yearU": false}, {"author": ["a_koolhaas"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_uk", "desc": "【流通】1972年のAA卒業制作。都市デザインの競技設計にも応募した。のちにMoMAが収蔵。\n【糸】言葉：物語として語る／フォトモンタージュ：コラージュ／重ねる：ロンドンを貫く帯\nコールハース、E.ゼンゲリス、M.ヴリーゼンドープ、Z.ゼンゲリス。AAでの修了制作であり、『Casabella』誌のコンペ応募作。", "era": "e_pre", "groups": ["g_aa", "g_oma"], "id": "n_exodus", "image": null, "intent": "i_both", "label": "コールハースほか《エクソダス》", "layer": ["l_b"], "medium": ["m_collage", "m_drawing"], "motif": ["m_text", "m_montage", "m_overlay"], "primary": "pr_online", "primaryRef": "【確認済】MoMA収蔵 https://www.moma.org/collection/works/104692", "role": "cand", "shape": null, "showImage": false, "summary": "ロンドンを貫く壁の中の都市。文章と画像で語るAAの卒業制作。", "type": "work", "urls": [], "why": ["w_critique"], "year": 1972, "yearEnd": null, "yearU": false}, {"author": ["a_ferriss"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_us", "desc": "【糸】ドローイング：木炭画として流通／高さ：法規が生む摩天楼\n【前史・図には載せない】1960年以前の作品のため、本文で流通の側面から触れる。再流通の出来事はコールハース『錯乱のニューヨーク』（1978）だが、図の中の案とは作者の重なりでしかつながらないため載せない。\n1916年のニューヨーク・ゾーニング条例が許す建物外形を描いたドローイング集。規則を可視化する「描く職能」。コールハース『錯乱のニューヨーク』(1978) で再読される。", "era": "e_pre", "groups": ["g_inst"], "id": "n_ferriss", "image": null, "intent": "__u", "label": "フェリス『明日のメトロポリス』", "layer": ["l_a"], "medium": ["m_drawing", "m_print"], "motif": ["m_drawing", "m_tower"], "primary": "pr_book", "primaryRef": "【見込み】フェリス『The Metropolis of Tomorrow』（1929）", "role": "hold", "shape": null, "showImage": false, "summary": "1916年のゾーニング法が生む摩天楼を木炭で描いた本。1978年の『錯乱のニューヨーク』で再流通した。", "type": "work", "urls": [], "why": ["w_dream"], "year": 1929, "yearEnd": null, "yearU": false}, {"author": ["a_price"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_uk", "desc": "【流通】日本には『建築の解体』のプライスの章で紹介された。1970年代にはアーキグラムとトロンヘイムのコンペで協働。\n【糸】可変：用途に応じて組み替わる／参加：利用者に応答する\n演出家ジョーン・リトルウッド、サイバネティクス研究者ゴードン・パスクとの協働。可変性そのものを設計した、完成を持たない建築。のちの《ジェネレーター》(1976–80) へ続く。", "era": "e_pre", "groups": ["g_aa", "g_kaitai", "g_cyber"], "id": "n_funpalace", "image": null, "intent": "i_build", "label": "プライス《ファン・パレス》", "layer": ["l_e"], "medium": ["m_plan"], "motif": ["m_metab", "m_crowd"], "primary": "pr_online", "primaryRef": "【確認済】CCA セドリック・プライス・アーカイブ（デジタル化資料を公開） https://www.cca.qc.ca/en/archives/380477/cedric-price-fonds", "role": "cand", "shape": null, "showImage": false, "summary": "用途に応じて組み替えられる娯楽と学びの装置。サイバネティクスを取り入れた。", "type": "work", "urls": [], "why": ["w_cond"], "year": 1961, "yearEnd": 1974, "yearU": false}, {"author": ["a_hollein"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_at", "desc": "【流通】フォトモンタージュ。『建築の解体』の連載で最初に論じられた。\n【糸】フォトモンタージュ：航空母艦を風景に貼り込む／重ねる：風景の上に置く／巨大構造：都市の大きさ\n風景に航空母艦を貼り込んだフォトモンタージュ。1968年、自ら編集する『Bau』で「すべては建築である」を発表。ホラインは1958–59年にイリノイ工科大学で学んだ。", "era": "e_pre", "groups": ["g_kaitai"], "id": "n_hollein", "image": null, "intent": "i_nobuild", "label": "ホライン《航空母艦都市》", "layer": ["l_b"], "medium": ["m_collage"], "motif": ["m_montage", "m_overlay", "m_mega"], "primary": "pr_online", "primaryRef": "【確認済】MoMA収蔵（Aircraft Carrier City in Landscape） https://www.moma.org/collection/works/634", "role": "cand", "shape": null, "showImage": false, "summary": "航空母艦を田園に置いたフォトモンタージュ。『建築の解体』の最初に論じられた。", "type": "work", "urls": [{"title": "artscape すべては建築である", "url": "https://artscape.jp/artword/6172/"}], "why": ["w_critique"], "year": 1964, "yearEnd": null, "yearU": false}, {"author": ["a_isozaki"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_jp", "desc": "【流通】『美術手帖』増刊『現代のイメージ』（1962年4月、瀧口修造編集）のためのモンタージュ。同年の「未来の都市と生活」展では観客参加のパフォーマンスとして再演。\n【糸】フォトモンタージュ：写真への貼り込み／廃墟：未来都市は廃墟である／参加：1962年の観客参加\n神殿遺構の写真にジョイント・コアの都市を重ねたコラージュ。「未来都市は廃墟である」。未来形と完了形の重畳（E層）。", "era": "e_pre", "groups": ["g_tange"], "id": "n_incubation", "image": null, "intent": "i_nobuild", "label": "磯崎新《孵化過程》", "layer": ["l_e"], "medium": ["m_collage"], "motif": ["m_montage", "m_ruin", "m_crowd"], "primary": "pr_book", "primaryRef": "【確認済】初出『美術手帖』増刊『現代のイメージ』（1962年4月）", "role": "paper", "shape": null, "showImage": false, "summary": "未来都市の写真に廃墟を重ねたモンタージュ。都市は完成せず廃墟に還るという批評。", "type": "work", "urls": [], "why": ["w_critique"], "year": 1962, "yearEnd": null, "yearU": false}, {"author": ["a_isozaki"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_cn", "desc": "【流通】1997年、NTTインターコミュニケーション・センター（ICC）での展覧会と、インターネット上での設計の実験。\n【糸】白紙：マカオ沖の人工島／参加：ネット上の参加／計算：人工生命のアルゴリズム\n珠海市沖の人工島計画。1997年のICC展は「シグネチャーズ」「ヴィジターズ」「インターネット」の三つの実験で構成し、街路パターンを人工生命のアルゴリズムで生成した。「ヴィジターズ」は2010年の「CITY2.0」展で再演。第3章への橋。", "era": "e_pre", "groups": ["g_cyber"], "id": "n_kaishi", "image": null, "intent": "i_both", "label": "磯崎新《海市》", "layer": ["l_c", "l_d"], "medium": ["m_exhibit", "m_digital"], "motif": ["m_blank", "m_crowd", "m_calc"], "primary": "pr_book", "primaryRef": "【確認済】図録『海市――もうひとつのユートピア』（NTT出版、1998）", "role": "paper", "shape": null, "showImage": false, "summary": "マカオ沖の人工島の都市を、展覧会とインターネット上の参加で設計し続けた実験。", "type": "work", "urls": [{"title": "artscape 海市", "url": "https://artscape.jp/artword/5735/"}, {"title": "Tokyo Art Beat 磯崎新再発見", "url": "https://www.tokyoartbeat.com/articles/-/rediscover-arata-isozaki-2023-02"}, {"title": "artscape 海市から都市ソラリスへ", "url": "https://artscape.jp/focus/10094718_1635.html"}], "why": ["w_cond"], "year": 1994, "yearEnd": 1997, "yearU": false}, {"author": ["a_isozaki"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_jp", "desc": "【糸】名づけ：海外のアンビルトを日本の正典にした連載／言葉：批評\n『美術手帖』1969年12月号〜73年11月号の連載（全10回）、1975年に単行本。1968年のミラノ・トリエンナーレの参加者を中心に、ホライン、アーキグラム、ムーア、プライス、アレグザンダー、ヴェンチューリ、スーパースタジオ／アーキズームの順に論じた。海外のアンビルトを日本の読者に届けた経路であり、ここで選ばれた顔ぶれが日本での正典になった。", "era": "e_pre", "groups": ["g_kaitai"], "id": "n_kaitai", "image": null, "intent": "__none", "label": "磯崎新『建築の解体』（美術手帖連載）", "layer": ["l_c"], "medium": ["m_print"], "motif": ["m_naming", "m_text"], "primary": "pr_book", "primaryRef": "【見込み】磯崎新『建築の解体』（美術出版社、1975）・『美術手帖』連載", "role": "cand", "shape": null, "showImage": false, "summary": "『美術手帖』の連載（1969〜73）。海外の実験的建築を日本に紹介し、正典をつくった。", "type": "media", "urls": [{"title": "artscape: 建築の解体", "url": "https://artscape.jp/artword/5855/"}], "why": ["__none"], "year": 1969, "yearEnd": 1975, "yearU": false}, {"author": ["a_kikutake"], "channel": "ch_trad", "coding": "c_simple", "color": null, "country": "c_jp", "desc": "【流通】1960年の世界デザイン会議で『METABOLISM/1960』の一部として発表。MoMA「ヴィジョナリー・アーキテクチャー」展への出品は要確認。\n【糸】白紙：海上に浮かぶ都市／可変：成長し取り替えられる／巨大構造：海上の構造\n陸の土地問題から離れ、海の上に浮かぶ都市を描いた構想。artscapeの「アンビルト」の項目も、参考資料に菊竹の「海洋都市」（1960）を挙げている。", "era": "e_pre", "groups": ["g_tange"], "id": "n_kikutake", "image": null, "intent": "i_both", "label": "菊竹清訓《海上都市》", "layer": ["l_b"], "medium": ["m_drawing", "m_model"], "motif": ["m_blank", "m_metab", "m_mega"], "primary": "pr_book", "primaryRef": "【確認済】インポッシブル・アーキテクチャー展図録（2019）に出品作として収録（海上都市1963）。初出は『METABOLISM/1960』", "role": "paper", "shape": null, "showImage": false, "summary": "海の上に浮かぶ人工の都市。陸の土地問題から離れた白紙の敷地に、成長する都市を描いた。", "type": "work", "urls": [{"title": "artscape: アンビルト", "url": "https://artscape.jp/artword/5545/"}], "why": ["w_dream"], "year": 1958, "yearEnd": 1963, "yearU": false}, {"author": ["a_metab"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_jp", "desc": "【流通】1960年の世界デザイン会議（東京）で、冊子『METABOLISM/1960』として発表。MoMA「ヴィジョナリー・アーキテクチャー」展への出品は要確認。\n【糸】可変：新陳代謝する都市／言葉：会議で配った宣言／巨大構造：都市規模の構想群\n1960年の世界デザイン会議で、宣言『METABOLISM/1960』とともに旗揚げした運動。50年代の丹下研が分かれ、その一部がグループになった。磯崎によれば、提案は実現を前提としており、実現できないことを目的にした「イマジナリー・モデル」の発想はグループ内になかった。60年代の提案はEXPO'70で総決算されたと磯崎は見る。", "era": "e_pre", "groups": ["g_tange"], "id": "n_metab", "image": null, "intent": "i_build", "label": "メタボリズム", "layer": [], "medium": ["m_print", "m_plan", "m_model"], "motif": ["m_metab", "m_text", "m_mega"], "primary": "pr_book", "primaryRef": "【見込み】『METABOLISM/1960』（1960）", "role": "cand", "shape": null, "showImage": false, "summary": "1960年の世界デザイン会議で宣言した運動。成長し取り替えられる都市を提案した。", "type": "movement", "urls": [{"title": "磯崎新「メタボリズムとの関係を聞かれるので、その頃を想い出してみた。」『10+1』No.13（1998）", "url": "https://db.10plus1.jp/backnumber/article/articleid/888/"}, {"title": "建築討論「メタボリズム」", "url": "http://touron.aij.or.jp/2017/06/3954"}], "why": ["w_cond"], "year": 1960, "yearEnd": 1970, "yearU": false}, {"author": ["a_drexler"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_us", "desc": "【糸】名づけ：建たない案を「ヴィジョナリー」として一つの棚に並べた\n1960年9月29日〜12月4日。「建てるには革命的すぎる」とされた20世紀の未実現案28件を、写真・模型・図面で集めた展覧会。ル・コルビュジエからマイケル・ウェッブ（のちのアーキグラム）まで。歴史的導入としてダ・ヴィンチやピラネージを添えた。ドレクスラーは、何がヴィジョナリーかは経済を含む社会の使われ方が決めると書いた。建たない案が一つの分類として美術館に並んだ年として、本論の起点に置く。", "era": "e_pre", "groups": ["g_inst"], "id": "n_moma1960", "image": null, "intent": "__none", "label": "MoMA「ヴィジョナリー・アーキテクチャー」展", "layer": ["l_c"], "medium": ["m_exhibit", "m_model"], "motif": ["m_naming"], "primary": "pr_online", "primaryRef": "【確認済】MoMAの広報資料（1960）", "role": "bridge", "shape": null, "showImage": false, "summary": "「建てるには革命的すぎる」20世紀の未実現案を集め、建たない案を一つの分類にした展覧会。", "type": "exhibit", "urls": [{"title": "MoMA press release (1960)", "url": "https://www.moma.org/docs/press_archives/2734/releases/MOMA_1960_0132_108.pdf"}, {"title": "Hope Svenson, Modern Visions (Yale M.E.D. thesis)", "url": "https://www.architecture.yale.edu/academics/programs/3-m-e-d/hope-svenson"}], "why": ["__none"], "year": 1960, "yearEnd": null, "yearU": false}, {"author": ["a_johnson"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_us", "desc": "【糸】名づけ：「脱構築主義」という分類／ドローイング：ザハは絵で出品\n1988年6月23日〜8月30日。ジョンソンとウィグリーの企画で、7組の建築家の近作を図面・模型で展示し、ザハはザ・ピークの絵画で参加した。導入部に館蔵のロシア・アヴァンギャルド（1913〜33年）の絵画・彫刻を置いた。広報資料は、ロシアの前衛の実験は構造として構想されたものではなかったのに対し、出品作はすべて建てるために設計されたと対比している。1920年代の前衛を再流通させ、ザハの絵を正典にした経路。", "era": "e_pre", "groups": ["g_inst", "g_ru"], "id": "n_moma1988", "image": null, "intent": "__none", "label": "MoMA「脱構築主義の建築」展", "layer": ["l_c", "l_e"], "medium": ["m_exhibit", "m_drawing", "m_model"], "motif": ["m_naming", "m_drawing"], "primary": "pr_online", "primaryRef": "【確認済】MoMAの広報資料・ファクトシート（1988）", "role": "cand", "shape": null, "showImage": false, "summary": "ロシア前衛を導入に置き、ザハのザ・ピークを絵画で展示した展覧会。", "type": "exhibit", "urls": [{"title": "MoMA fact sheet (1988)", "url": "https://www.moma.org/momaorg/shared/pdfs/docs/press_archives/6526/releases/MOMA_1988_0029_29.pdf"}, {"title": "MoMA press release (1988)", "url": "https://www.moma.org/docs/press_archives/6559/releases/MOMA_1988_0062_63.pdf"}], "why": ["__none"], "year": 1988, "yearEnd": null, "yearU": false}, {"author": ["a_zha"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_it", "desc": "【糸】名前：様式に名前を付ける／計算：スクリプトで形を生む／言葉：マニフェスト\n【本文のみ】2008年の第11回ヴェネチア・ビエンナーレで発表された宣言。パラメトリシズムを「モダニズム以後の偉大な新様式」と呼び、直線・直角・角を避けること、スクリプトや生成的な部品を使うことを掲げた。「parametric」の語は、のちにSNSのアカウント名やタグになる。", "era": "e_pre", "groups": ["g_cyber"], "id": "n_param", "image": null, "intent": "__none", "label": "シューマッハー「パラメトリシズム宣言」", "layer": [], "medium": ["m_print"], "motif": ["m_name", "m_calc", "m_text"], "primary": "pr_online", "primaryRef": "【見込み】シューマッハーのサイトに掲載された宣言文", "role": "cand", "shape": null, "showImage": false, "summary": "ZHAのシューマッハーが2008年に「モダニズム以後の新様式」として名づけた宣言。", "type": "media", "urls": [{"title": "Design Manifestos: Parametricism as Style", "url": "https://designmanifestos.org/patrik-schumacher-parametricism-as-style-parametricist-manifesto/"}, {"title": "Dezeen: A simple guide to parametricism (2026)", "url": "https://www.dezeen.com/2026/05/06/parametricism-simple-guide/"}], "why": ["__none"], "year": 2008, "yearEnd": null, "yearU": false}, {"author": ["a_zaha"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_hk", "desc": "【流通】香港のコンペ（1983年、539案、磯崎が審査）で当選。同年、AAでの展覧会と作品集「プラネタリー・アーキテクチャー・ツー」。1988年のMoMA「脱構築主義の建築」展に絵画として出品。\n【糸】審査と落選：当選しても建たない／名前：ザハの名を広めた／ドローイング：絵として流通\n香港の会員制クラブ計画のコンペで1等。539案から選ばれ、磯崎新はUIA代表の審査員だった。開発業者の破綻で実現せず。前段にAA卒業制作《マレーヴィチのテクトニク》(1977)。", "era": "e_pre", "groups": ["g_aa", "g_oma", "g_inst"], "id": "n_peak", "image": null, "intent": "i_build", "label": "ザハ《ザ・ピーク》", "layer": ["l_a"], "medium": ["m_drawing"], "motif": ["m_jury", "m_name", "m_drawing"], "primary": "pr_online", "primaryRef": "【確認済】MoMA「脱構築主義の建築」展の広報資料（1988） https://www.moma.org/docs/press_archives/6559/releases/MOMA_1988_0062_63.pdf 、AA作品集『Planetary Architecture Two』（1983）", "role": "paper", "shape": null, "showImage": false, "summary": "香港の丘の上のクラブ案。コンペに当選したが建たず、絵画として流通してザハの名を広めた。", "type": "work", "urls": [{"title": "UIA ザ・ピーク競技結果", "url": "https://uia-architectes.org/?p=18156"}, {"title": "東京オペラシティ ザハ展解説", "url": "https://operacity.jp/ag/exh169/e/exh.php"}], "why": ["w_cond"], "year": 1983, "yearEnd": null, "yearU": false}, {"author": ["a_mvrdv"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_nl", "desc": "【流通】2001年、ハーグの美術センター「ストローム」で映像とともに発表。広く報道され、激しい論争を呼んだ。\n【糸】計算：統計が形を決める／巨大構造：豚の塔の群れ\nオランダの豚の数が人口とほぼ同じという統計から出発し、有機飼育を続ければ国土の大半が養豚に要るという計算を、積み重ねた豚の塔の群れとして示した研究提案。統計が形を決める《メタシティ／データタウン》（1998〜）の延長で、評者はこれを「データの崇高」と呼んだ。", "era": "e_pre", "groups": ["__none"], "id": "n_pigcity", "image": null, "intent": "i_both", "label": "MVRDV《ピッグ・シティ》", "layer": ["l_a", "l_c"], "medium": ["m_digital"], "motif": ["m_calc", "m_mega"], "primary": "pr_online", "primaryRef": "【確認済】MVRDV公式サイトのプロジェクトページ https://mvrdv.com/projects/134/pig-city", "role": "paper", "shape": null, "showImage": false, "summary": "統計から導いた豚の飼育タワーの群れ。データが形を決める研究提案として論争を呼んだ。", "type": "work", "urls": [{"title": "MVRDV: Pig City", "url": "https://mvrdv.com/projects/134/pig-city"}, {"title": "Stroom (2001)", "url": "https://www.stroom.nl/en/stroom/agenda-en/mvrdv"}, {"title": "Artforum", "url": "https://www.artforum.com/events/mvrdv-206115/"}, {"title": "Bidoun", "url": "https://bidoun.org/articles/agropolis-now"}], "why": ["w_critique"], "year": 2001, "yearEnd": null, "yearU": false}, {"author": ["a_tatlin", "a_malevich", "a_leonidov"], "channel": "ch_trad", "coding": "c_none", "color": null, "country": "c_ru", "desc": "【糸】ドローイング：構成主義の絵・模型／名前：マレーヴィチらの名が再流通する／高さ：400mのタトリンの塔\n【前史・図には載せない】1960年以前の作品のため、本文で流通の側面から触れる。図では再流通の出来事（ザハ《マレーヴィチのテクトニク》1976–77、「偉大なるユートピア」展1992）として表す。\n入口を三つに分けて扱う。タトリン《第三インターナショナル記念塔》(1919–20)、マレーヴィチ《アルキテクトン》(1920年代)、レオニドフ《レーニン研究所》(1927)。ザハはマレーヴィチから、コールハースはレオニドフから引き継いだ。", "era": "e_pre", "groups": ["g_ru"], "id": "n_ru", "image": null, "intent": "__u", "label": "ロシア・アヴァンギャルド", "layer": ["l_a"], "medium": ["m_model", "m_drawing", "m_plan"], "motif": ["m_drawing", "m_name", "m_tower"], "primary": "pr_book", "primaryRef": "【確認済】インポッシブル・アーキテクチャー展図録（2019）に出品作として収録（タトリン・マレーヴィチ）", "role": "hold", "shape": null, "showImage": false, "summary": "1910〜30年代の前衛の構想群。1970年代以降のAAや1988年のMoMA展で再流通した。", "type": "movement", "urls": [], "why": ["w_cond"], "year": 1919, "yearEnd": 1934, "yearU": false}, {"author": ["a_zaha"], "channel": "ch_hinge", "coding": "c_simple", "color": null, "country": "c_jp", "desc": "【流通】2012年のコンペ（審査委員長は安藤忠雄）で当選。2013年8月、槇文彦が『JIA MAGAZINE』で結果を批判し、シンポジウムのネット配信、署名運動、海外メディアの報道に広がって、2015年7月に白紙撤回。再コンペで隈研吾らの案が選ばれた。\n【糸】審査と落選：当選後に撤回／名前：「アンビルトの女王」の最後の大きな案\nコンペ当選後、構造・コスト・景観をめぐる公論を経て2015年に白紙撤回。隈研吾らの案が建設された。D層の中心事例（第1章）。", "era": "e_pre", "groups": ["g_inst", "g_cyber"], "id": "n_stadium", "image": null, "intent": "i_build", "label": "ZHA＋設計JV《新国立競技場》", "layer": ["l_d"], "medium": ["m_digital", "m_plan"], "motif": ["m_jury", "m_name"], "primary": "pr_book", "primaryRef": "【確認済】インポッシブル・アーキテクチャー展図録（2019）に出品作として収録（出口の展示）", "role": "paper", "shape": null, "showImage": false, "summary": "新国立競技場のコンペ当選案。ネットにも広がった公論の高まりを受け、2015年に白紙撤回された。", "type": "work", "urls": [], "why": ["w_cond"], "year": 2012, "yearEnd": 2015, "yearU": false}, {"author": ["a_superstudio"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_it", "desc": "【流通】『建築の解体』の連載の最後に論じられた。1972年のMoMA「イタリア：新しい家庭の風景」展では映画《スーパーサーフェス》をつくり、会場で上映。\n【糸】巨大構造：地表を覆う白い格子／フォトモンタージュ：写真への貼り込み／廃墟：近代建築の行き着く先への批評\n地表を覆う連続体の連作フォトモンタージュ。パネル間の関係が論を成す（B層）。", "era": "e_pre", "groups": ["g_kaitai"], "id": "n_superstudio", "image": null, "intent": "i_nobuild", "label": "スーパースタジオ《コンティニュアス・モニュメント》", "layer": ["l_b"], "medium": ["m_collage"], "motif": ["m_mega", "m_montage", "m_ruin"], "primary": "pr_online", "primaryRef": "【確認済】MoMA収蔵（The Continuous Monument、ギルマン・コレクション）", "role": "paper", "shape": null, "showImage": false, "summary": "地表を覆う白い格子の巨大構造を写真に貼り込み、近代建築の行き着く先を批評した。", "type": "work", "urls": [], "why": ["w_critique"], "year": 1969, "yearEnd": null, "yearU": false}, {"author": ["a_zaha"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_uk", "desc": "【流通】AAの課題（1976〜77）。アクリル画として制作され、のちにザハ財団のアーカイブで再発見された。\n【糸】ドローイング：アクリル画／名前：題名がマレーヴィチの名を借りる\nAA在学中、コールハースとゼンゲリスのユニットでの課題。マレーヴィチの「アルキテクトン」をもとに、テムズ川のハンガーフォード橋に架かる14層のホテルを、アクリル画として描いた。ユニットはロシア・アヴァンギャルドの未完のユートピアを主題にしていた。絵画で建築を描くこの方法は、以後のザハの仕事に一貫して続く。1920年代の前衛が、1970年代のロンドンで再び流通した出来事。", "era": "e_pre", "groups": ["g_aa", "g_oma", "g_ru"], "id": "n_tektonik", "image": null, "intent": "i_nobuild", "label": "ザハ・ハディド《マレーヴィチのテクトニク》", "layer": ["l_b", "l_e"], "medium": ["m_drawing"], "motif": ["m_drawing", "m_name"], "primary": "pr_online", "primaryRef": "【確認済】ザハ・ハディド財団の収蔵品ページ https://www.zhfoundation.com/collections/malevichs-tektonik/", "role": "cand", "shape": null, "showImage": false, "summary": "マレーヴィチのアルキテクトンをもとに、橋の上のホテルを絵画で描いたAAの課題。", "type": "work", "urls": [{"title": "Zaha Hadid Foundation: Malevich’s Tektonik", "url": "https://www.zhfoundation.com/collections/malevichs-tektonik/"}, {"title": "Dezeen: Ten items from the Zaha Hadid archives (2026)", "url": "https://www.dezeen.com/2026/03/31/zaha-hadid-archive-aric-chen/"}], "why": ["w_dream"], "year": 1976, "yearEnd": 1977, "yearU": false}, {"author": ["a_isozaki"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_jp", "desc": "【流通】新都庁舎コンペ（1985〜86）。師の丹下案が当選し、磯崎の低層案は建たないまま発表された。\n【糸】審査と落選：唯一の中層案として議論され続けた落選案／宛先：都庁舎のあり方への申し立て\n指名コンペで、超高層を求める与件に対し低層で巨大な空隙をもつ案を提出。師・丹下の超高層案が当選し建設された。", "era": "e_pre", "groups": ["g_tange", "g_inst"], "id": "n_tocho", "image": null, "intent": "i_build", "label": "磯崎新《東京都新都庁舎案》", "layer": ["l_d"], "medium": ["m_plan", "m_model"], "motif": ["m_jury", "m_address"], "primary": "pr_book", "primaryRef": "【見込み】磯崎新『UNBUILT』（2001）・1986年の新都庁舎コンペ応募案の発表誌（要特定）／図録『インポッシブル・アーキテクチャー』（2019）に断面模型とCG図面が収録", "role": "paper", "shape": null, "showImage": false, "summary": "新都庁舎コンペの磯崎案。超高層を避けた案で、落選後も実現案と並べて語られ続けた。", "type": "work", "urls": [], "why": ["w_cond", "w_critique"], "year": 1986, "yearEnd": null, "yearU": false}, {"author": ["a_tange", "a_isozaki"], "channel": "ch_trad", "coding": "c_detail", "color": null, "country": "c_jp", "desc": "【流通】『新建築』1961年3月号の特集と、その模型写真。模型写真は建築界を越えて社会に大きな反響を呼んだ。\n【糸】白紙：東京湾を敷地にする／巨大構造：湾を横断する都市軸\n東京湾上へ延びる都市軸の提案（1961年発表）。丹下研には磯崎、黒川紀章らが参加した。MITでの《ボストン湾計画》(1959) が前段。", "era": "e_pre", "groups": ["g_tange"], "id": "n_tokyo , "label": "スタニスラス・シャイユー《アーキガン》", "layer": [], "medium": ["m_ai"], "motif": ["m_calc", "m_name"], "primary": "pr_online", "primaryRef": "【確認済】シャイユー本人によるNVIDIAブログの記事と修士論文", "role": "hold", "shape": null, "showImage": false, "summary": "敵対的生成ネットワークで間取りや建物全体を生成したハーバードGSDの修士研究。バロックやヴィクトリア朝など「様式」ごとに学習させた。", "type": "work", "urls": [{"title": "NVIDIA Developer Blog", "url": "https://developer.nvidia.com/blog/archigan-generative-stack-apartment-building-design/"}], "why": ["w_dream"], "year": 2019, "yearEnd": null, "yearU": false}, {"author": ["ax_050"], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "c_us", "desc": "【流通】Instagramでの特集投稿。\n【糸】名づけ：生成画像を集めて分類する／参加：多くの投稿者の画像\n建築メディアArchitizerが開いた、Midjourneyの建築画像を集めて紹介するInstagramアカウント。\n【v9】第5章で論じないため、第5章の図には載せない（v8には残る）。", "era": "e_sns", "groups": ["g_genai"], "id": "q_architizer", "image": null, "intent": "i_nobuild", "label": "Architizer《Midjourney Architecture》アカウント", "layer": [], "medium": ["m_ai"], "motif": ["m_naming", "m_crowd"], "primary": "pr_online", "primaryRef": "【確認済】ArchitizerのInstagramアカウントの投稿", "role": "hold", "shape": null, "showImage": false, "summary": "建築メディアArchitizerが開いた、Midjourneyの建築画像を集めて紹介するInstagramアカウント。", "type": "account", "urls": [], "why": ["w_dream"], "year": 2022, "yearEnd": null, "yearU": false}, {"author": ["ax_045"], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "cx_07", "desc": "【流通】Instagramへの投稿と、建築メディアの紹介。\n【糸】擬似的な実現：CGの中の空間／ドローイング：一枚の絵として完結する\n淡い色の「想像の建築空間」の3DCGをInstagramに投稿し、多くのフォロワーを得たデジタルアーティスト。ロッシやスーパースタジオを参照する（生成AIではなくCG）。\n【NFT】Instagramで知られた自作のレンダリングを、NFTとして競売にかけた（第3章3-5の注）。《Mars House》と弱い糸で結ぶ。【要確認】競売の年と取引サイト。\n【v9】発表の場に「自主刊行・アカウント（自前の媒体）」を追加（第5章）。\n【第5章】5-4-2、5-4-4で論じる。", "era": "e_sns", "groups": ["g_cgsns"], "id": "q_christodoulou", "image": null, "intent": "i_nobuild", "label": "アレクシス・クリストドゥル（@teaaalexis）", "layer": [], "medium": ["m_digital"], "motif": ["m_render", "m_drawing", "m_self"], "primary": "pr_online", "primaryRef": "【確認済】本人のInstagram（@teaaalexis）の投稿", "role": "paper", "shape": null, "showImage": false, "summary": "淡い色の「想像の建築空間」の3DCGをInstagramに投稿し、多くのフォロワーを得たデジタルアーティスト。ロッシやスーパースタジオを参照する（生成AIではなくCG）。のちに、Instagramで知られた自作のレンダリングをNFTとして競売にかけた。", "type": "account", "urls": [{"title": "Dezeen (2018)", "url": "https://www.dezeen.com/2018/07/16/digital-artist-alexis-christodoulou-dream-imagined-architectural-spaces-instagram/"}], "why": ["w_dream"], "year": 2017, "yearEnd": null, "yearU": false}, {"author": [], "channel": "ch_inst", "coding": "c_none", "color": null, "country": null, "desc": "【第4章】4-6「選別と作者性」で扱う制度の判断。事例ではなく「経路・つなぎ」として載せる。\n【糸】規則やプログラム：計算が形を決めるとき、誰が作者かを制度が判断する\n米国著作権局は2023年2月、Midjourneyで生成した画像を用いたコミックについて、個々の画像の著作権を認めず、文章と、文章および画像の選択と配列についてのみ登録を認めた。日本の文化審議会の小委員会は2024年3月、AI生成物が著作物と認められるには人間の創作意図と創作的寄与が必要との考え方を示した。\n【第5章】5-4-2で論じる。", "era": "e_sns", "groups": ["g_inst"], "id": "q_copyright", "image": null, "intent": "__none", "label": "生成AI画像の著作権判断（米国著作権局 2023・文化審議会 2024）", "layer": [], "medium": ["m_digital"], "motif": ["m_calc"], "primary": "pr_online", "primaryRef": "【確認済】米国著作権局の決定書、文化審議会の文書（第4章の出典）", "role": "paper", "shape": null, "showImage": false, "summary": "生成そのものではなく、選択と配列など前後の人間の行為に作者性を認めた制度の判断。", "type": "event", "urls": [{"title": "U.S. Copyright Office: Zarya of the Dawn (2023-02-21)", "url": "https://copyright.gov/docs/zarya-of-the-dawn.pdf"}, {"title": "文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（2024-03-15）", "url": "https://current.ndl.go.jp/car/218811"}], "why": ["__none"], "year": 2023, "yearEnd": 2024, "yearU": false}, {"author": [], "channel": "ch_inst", "coding": "c_none", "color": null, "country": null, "desc": "【第5章】5-2・5-6で扱う、応答（指摘）が返った事例。\n【流通】開発者や行政が公開したレンダリングを、住民・活動家・独立の分析者がSNSと画像検索で検証した。\n【糸】フォトモンタージュ：既存の街に合成された像／既存の都市の上や中／依頼のない提案の裏返し：宛先（住民・行政）のある像には指摘が返る\nArchDailyの総括（Ananya Nayak、2025年12月12日）によれば、ニューヨークでは解体予定の公営住宅棟の上に「コミュニティ・テラス」が合成されていたことを活動家が明らかにし、上海では文化地区のレンダリングで非公式の住居集落が合成の緑地に置き換えられていたことを独立の分析者が指摘した。ムンバイとドバイの事例も挙げられている。インドの建築評議会は、レンダリングの来歴メタデータ、AIプロンプトの開示、可視の透かし、雰囲気の画像と技術図面の審査の分離を求めるガイドライン草案を出したとされる。\n【要確認】各事例の一次資料（指摘した側の発表、ガイドライン草案の原文）は未確認。公開から指摘までの日数も未計測。\n【第5章】5-2-3、5-6-3で論じる。", "era": "e_sns", "groups": ["g_inst"], "id": "q_dispute2025", "image": null, "intent": "__none", "label": "2025年のレンダリング係争（公営住宅の合成テラスほか）", "layer": ["l_d"], "medium": ["m_digital"], "motif": ["m_montage", "m_overlay", "m_address"], "primary": "pr_secondary", "primaryRef": "【二次資料のみ】ArchDailyの総括記事（2026-11-13に内容を確認）。各事例の一次資料は要調査", "role": "paper", "shape": null, "showImage": false, "summary": "開発計画のレンダリングに合成や置き換えがあると、住民や活動家が指摘した一連の出来事。", "type": "event", "urls": [{"title": "ArchDaily: How 2025 Turned Architectural Visuals Into Disputed Media (2025-12-12)", "url": "https://www.archdaily.com/1036773/how-2025-turned-architectural-visuals-into-disputed-media"}], "why": ["__none"], "year": 2025, "yearEnd": null, "yearU": false}, {"author": ["ax_049"], "channel": "ch_inst", "coding": "c_none", "color": null, "country": "c_us", "desc": "【流通】ウェブのサービスとして公開され、SNSで利用が広がった。\n【糸】計算：文章から画像を生成する／名前：建築家名が指示の語になる／言葉：プロンプト\n2022年、文章から画像を生成するAIが相次いで一般に使えるようになった。建築の画像も誰もが大量に生成できるようになった。\n【v9・第3章3-5】2025年には動画生成モデル（5月：GoogleのVeo 3、6月：MidjourneyのV1）が公開され、対象アカウントの投稿は静止画から動画へ移りつつある。\n【第5章】5-5で論じる。", "era": "e_sns", "groups": ["g_genai"], "id": "q_genai", "image": null, "intent": "__none", "label": "画像生成AIの一般公開（DALL·E 2・Midjourney・Stable Diffusion）", "layer": [], "medium": ["m_ai"], "motif": ["m_calc", "m_name", "m_text"], "primary": "pr_online", "primaryRef": "【確認済】各サービスの公式発表", "role": "bridge", "shape": null, "showImage": false, "summary": "2022年、文章から画像を生成するAIが相次いで一般に使えるようになった。建築の画像も誰もが大量に生成できるようになった。", "type": "media", "urls": [], "why": ["__none"], "year": 2022, "yearEnd": null, "yearU": false}, {"author": ["ax_043"], "channel": "ch_inst", "coding": "c_simple", "color": null, "country": "c_fr", "desc": "【流通】ウェブ上の応募と一般投票。\n【糸】審査と落選：一般投票で選ぶ／参加：大勢の投票\n独立系の出版社が開いた非公式コンペ。56か国から226案が集まり、3万人以上の一般投票で1等が決まった。\n【v9】第5章で論じないため、第5章の図には載せない（v8には残る）。", "era": "e_sns", d-prompts-for-ai-videos-and-images/"}], "why": ["__none"], "year": 2025, "yearEnd": null, "yearU": false}, {"author": ["ax_051"], "channel": "ch_inst", "coding": "c_none", "color": null, "country": "c_uk", "desc": "【流通】書籍として刊行された。\n【糸】名づけ：AI建築を論の対象にする／計算：AIによる設計／言葉：本\n建築家向けにAIを概説した本。AIによる設計と画像生成を建築論として論じた。\n【v9】第5章で論じないため、第5章の図には載せない（v8には残る）。", "era": "e_sns", "groups": ["g_digital"], "id": "q_leach", "image": null, "intent": "__none", "label": "ニール・リーチ『Architecture in the Age of Artificial Intelligence』", "layer": [], "medium": ["m_print"], "motif": ["m_naming", "m_calc", "m_text"], "primary": "pr_book", "primaryRef": "【見込み】リーチ『Architecture in the Age of Artificial Intelligence』（2022）", "role": "hold", "shape": null, "showImage": false, "summary": "建築家向けにAIを概説した本。AIによる設計と画像生成を建築論として論じた。", "type": "media", "urls": [], "why": ["__none"], "year": 2022, "yearEnd": null, "yearU": false}, {"author": [], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "c_us", "desc": "【第3章】3-5(1)「前史」で扱う事例。\n【流通】NFTの取引サイトSuperRareで競売にかけられ、建築メディアが報じた。\n【糸】CG・映像：実在しない住宅を写真のように描く／ドローイング：建たない住宅の像が作品として売買される\n2020年に設計された仮想の住宅。SuperRareが「最初のNFTのデジタル住宅」と称し、288イーサ（約51万2千ドル）で売れた（Dezeen、2021年3月22日）。画像生成AIは、実在しない建築の画像がすでに流通し売買されている状況のなかに現れた。\n【NFT】第3章は、SuperRareで288イーサ（約50万ドル）で売れたことをdesignboom（2021年3月15日）によって注記している。クリストドゥルのNFTの競売と弱い糸で結ぶ。\n【第5章】5-4-2で論じる。", "era": "e_sns", "groups": ["g_digital", "g_cgsns"], "id": "q_marshouse", "image": null, "intent": "i_nobuild", "label": "クリスタ・キム《Mars House》（NFTとして売られた住宅）", "layer": ["l_c"], "medium": ["m_digital"], "motif": ["m_render", "m_drawing"], "primary": "pr_online", "primaryRef": "【確認済】作者の公式サイト（kristakimstudio.com/marshouse）。売却額はDezeenの記事で確認（2026-11-13）", "role": "paper", "shape": null, "showImage": false, "summary": "実在しない住宅のCGがNFTとして288イーサ（約51万ドル）で売れた。生成AIの前史。", "type": "work", "urls": [{"title": "designboom: first NFT digital home (2021-03-15、第3章の注の出典)", "url": "https://www.designboom.com/art/first-nft-digital-home-architectural-luxury-digital-03-15-2021/"}, {"title": "Dezeen: Artist Krista Kim sells \"first NFT digital house in the world\" (2021-03-22)", "url": "https://www.dezeen.com/2021/03/22/mars-house-krista-kim-nft-news"}, {"title": "Krista Kim Studio: MARS HOUSE", "url": "https://kristakimstudio.com/marshouse"}], "why": ["w_dream"], "year": 2021, "yearEnd": null, "yearU": false}, {"author": ["ax_040"], "channel": "ch_ext", "coding": "c_none", "color": null, "country": "c_us", "desc": "【流通】報道と講演で紹介された。\n【糸】巨大構造：地球全体の計画／言葉：計画書として示す／白紙：地球全体を敷地にする\n持続可能な地球のための「地球全体の基本計画」としてBIGが進める構想（2021年時点で進行中と報道）。\n【v9】第5章で論じないため、第5章の図には載せない（v8には残る）。", "era": "e_sns", "groups": ["__none"], "id": "q_masterplanet", "image": null, "intent": "i_nobuild", "label": "BIG《マスタープラネット》", "layer": [], "medium": ["m_digital"], "motif": ["m_mega", "m_text", "m_blank"], "primary": "pr_secondary", "primaryRef": "【見込み】BIGによる一次の公開資料は未確認（要調査）", "role": "hold", "shape": null, "showImage": false, "summary": "持続可能な地球のための「地球全体の基本計画」としてBIGが進める構想（2021年時点で進行中と報道）。", "type": "work", "urls": [{"title": "Dezeen (2021)", "url": "https://www.dezeen.com/2021/09/01/bjarke-ingels-telosa-city-marc-lore/"}], "why": ["w_dream"], "year": 2021, "yearEnd": null, "yearU": false}, {"author": ["ax_081"], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "c_at", "desc": "【第3章】Instagramの10アカウントの一つ（2026年10月確定）。\n【系譜上の糸】風景のなかに構築物を置く操作。写真への貼り込みではないが、フォトモンタージュ的な技法の新しい形とみなしうる。対応しうる古典：ホライン《航空母艦都市》（1964）。\n【流通】Instagramへの投稿（開設年は要確認）。\n【糸】計算：生成AIで描く／フォトモンタージュ：構築物と自然の風景とを継ぎ目のない一枚の像として生成する／既存の都市の上や中：実在しそうな風景のなかに構築物を置く\nウィーンを拠点とする建築デザイナー（実名非公表）が運営。自然の風景のなかに構築物を溶け込ませる像を投稿し、キャプションにMidjourneyで制作した構想にすぎないと記す定型文を付す。2025年の調査時点で約37万のフォロワー。\n【v9】発表の場に「自主刊行・アカウント（自前の媒体）」を追加（第5章）。2026年11月、遺跡の再生とする読みを改め、「廃墟として描く」から外し、弱い糸の相手を磯崎新《孵化過程》からホライン《航空母艦都市》に替えた。\n【第5章】5-3〜5-6（第3章の10アカウント）で論じる。", "era": "e_sns", "groups": ["g_genai", "g_ig10"], "id": "q_matitectura", "image": null, "intent": "i_nobuild", "label": "Matitectura（@matitectura）", "layer": [], "mediu 9, "yearU": false}, {"author": ["ax_042"], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "c_fr", "desc": "【流通】Instagramへの投稿と、建築メディアのまとめ記事。\n【糸】宛先：ノートルダムへの頼まれない提案の氾濫／重ねる：既存の大聖堂に足す／審査と落選：示唆された国際コンペ\n2019年の火災後、政府が新しい尖塔の国際コンペを示唆したことで、ガラスの屋根や光の尖塔などの案がSNSに次々と投稿された。2020年、元どおりに再建されることが決まった。\n【v9.2】2026年11月、火災の跡を廃墟として描く案ではなく、大聖堂を新しい姿へ変える提案と読み直し、「廃墟として描く」から外した。\n【v9.1】生成AI以前に、建たない案がSNS上で流通した事例として、第5章の図に載せる（5-1、5-4-3）。\n【第5章】5-1、5-4-3で論じる。", "era": "e_sns", "groups": ["g_cgsns"], "id": "q_notredame", "image": null, "intent": "__none", "label": "ノートルダム大聖堂の尖塔をめぐる提案の氾濫", "layer": [], "medium": ["m_digital"], "motif": ["m_address", "m_overlay", "m_jury"], "primary": "pr_online", "primaryRef": "【見込み】各デザイナーのInstagramへの元の投稿（散在、取得日を記録）", "role": "paper", "shape": null, "showImage": false, "summary": "2019年の火災後、政府が新しい尖塔の国際コンペを示唆したことで、ガラスの屋根や光の尖塔などの案がSNSに次々と投稿された。2020年、元どおりに再建されることが決まった。", "type": "event", "urls": [{"title": "Dezeen (2020)", "url": "https://www.dezeen.com/2020/07/13/notre-dame-cathedral-spire-reconstruction-macron/"}], "why": ["__none"], "year": 2019, "yearEnd": 2020, "yearU": false}, {"author": ["ax_040", "ax_041"], "channel": "ch_ext", "coding": "c_simple", "color": null, "country": "cx_06", "desc": "【流通】国連の会議と、レンダリングや動画のネット上の拡散。\n【糸】白紙：浮遊都市／可変：モジュールで育つ\n海面上昇に備え、モジュールを増やして育つ浮遊都市。2019年の国連の会議で発表され、釜山での試作が計画された。\n【第5章】5-4-1で論じる。", "era": "e_sns", "groups": ["g_inst"], "id": "q_oceanix", "image": null, "intent": "i_both", "label": "BIG＋オセアニクス《オセアニクス・シティ》", "layer": [], "medium": ["m_digital"], "motif": ["m_blank", "m_metab"], "primary": "pr_online", "primaryRef": "【見込み】オセアニクスとBIGの公式サイト", "role": "paper", "shape": null, "showImage": false, "summary": "海面上昇に備え、モジュールを増やして育つ浮遊都市。2019年の国連の会議で発表され、釜山での試作が計画された。", "type": "work", "urls": [{"title": "Architect Magazine", "url": "https://www.architectmagazine.com/?p=358695"}], "why": ["w_dream"], "year": 2019, "yearEnd": null, "yearU": false}, {"author": [], "channel": "ch_inst", "coding": "c_none", "color": null, "country": "c_us", "desc": "【第3章】3-2の年表、【第4章】4-5-1で扱う配信の装置。\n【流通】Metaの技術ブログと論文で仕組みが公表された。\n【糸】名づける場：何が並んで見えるかを決める主体が、編集者・学芸員から装置へ移る／計算：反応の統計が配信を決める\n2016年、フィードは時系列から順位づけに変わった。2019年に公表されたig2vecは、利用者が反応したアカウントのIDを文中の単語のように扱い、同じセッションで反応されやすいアカウントどうしを近いものとして学習する。2023年のTwo Towerは、利用者と投稿を別々のネットワークで数値の列に変換する。公開資料の範囲では、装置が学習するのは利用者の反応であり、投稿が何を提案しているかではない（第4章4-5-1 註4）。\n【第5章】5-4-3、5-5-2、5-7で論じる。", "era": "e_sns", "groups": ["g_genai"], "id": "q_reco", "image": null, "intent": "__none", "label": "Instagramの推薦システム（順位づけ2016・ig2vec 2019・Two Tower 2023）", "layer": ["l_c"], "medium": ["m_digital"], "motif": ["m_naming", "m_calc"], "primary": "pr_online", "primaryRef": "【確認済】Meta AI（2019年11月25日）、Engineering at Meta（2023年8月9日）。2016年の順位づけ導入は第3章の年表の出典による", "role": "bridge", "shape": null, "showImage": false, "summary": "投稿を利用者ごとに選んで届ける配信の装置。アカウントIDを単語のように扱い、反応の近さで並べる。", "type": "media", "urls": [{"title": "Meta AI: Powered by AI: Instagram’s Explore recommender system (2019)", "url": "https://ai.meta.com/blog/powered-by-ai-instagrams-explore-recommender-system/"}, {"title": "Engineering at Meta: Scaling the Instagram Explore recommendations system (2023)", "url": "https://engineering.fb.com/2023/08/09/ml-applications/scaling-instagram-explore-recommendations-system/"}], "why": ["__none"], "year": 2016, "yearEnd": 2023, "yearU": false}, {"author": ["ax_040", "ax_046"], "channel": "ch_ext", "coding": "c_simple", "color": null, "country": "c_us", "desc": "【流通】SNSでの発表と世界の報道。\n【糸】白紙：砂漠の新都市／巨大構造：500万人の都市\n起業家ロアがBIGと描いた、米国の砂漠に500万人の新都市をつくる構想。BIGのTwitterで発表された。\n【第5章】5-4-1で論じる。", "era": "e_sns", "groups": ["__none"], "id": "q_telosa", "image": null, "intent": "i_both", "label": "BIG＋マーク・ロア《テロサ》", "layer": [], "medium": ["m_digital"], "motif": ["m_blank", "m_mega"], "primary": "pr_online", "primaryRef": "【見込み】テロサの公式サイト", "role": "paper", "shape": null, "showImage": false, "summary": "起業家ロアがBIGと描いた、米国の砂漠に500万人の新都市をつくる構想。BIGのTwitterで発表された。", "type": "work", "urls": [{"title": "Dezeen (2021)", "url": "https://www.dezeen.com/2021/09/01/bjarke-ingels-telosa-city-marc-lore/"}], "why": ["w_dream"], "year": 2021, "yearEnd": null, "yearU": false}, {"author": ["ax_047"], "channel": "ch_ext", "coding": "c_simple", "color": null, "country": "cx_08", "desc": "【流通】NEOMの発表（2021年1月）と、動画・レンダリングの配信。2022〜23年にはリヤドで「THE LINE Experience」展が開かれた。\n【糸】巨大構造：170kmの線状都市／白紙：砂漠／高さ：国家の広報としての高さ500mの壁\n【古典とのつながり】発表の直後からスーパースタジオの《コンティニュアス・モニュメント》（1969）と比較された。スーパースタジオのフラッシネッリは「自分の想像したディストピアがつくられるのを見るのは、望みうる最良のことではない」と述べた（Guardian、オリバー・ウェインライト、2022年9月）。リヤドの展覧会では、ピーター・クック（アーキグラム）、コープ・ヒンメルブラウ、OMA、モーフォシスなど12組が設計者として名を挙げられた（Architects’ Journalの報道をArchinectが2023年2月2日に紹介。各組の担当範囲は不明）。\n【ネオとのつながり】2024年、ザ・ラインを反転させた像を生成AIで描いた《THE (OTHER) LINE》が公開された。2025年10月には、生成AIでつくられた「スカイ・スタジアム」の動画が、ザ・ライン内の公式のスタジアム案として拡散し、複数の報道機関が公式案として報じた（AFPが検証）。\n【縮小】Bloomberg（2024年4月5日）は、2030年までに完成するのは2.4kmで、居住者は30万人未満と報じた（Architectural Record、2024年4月17日）。2026年7月の報道では、公式サイトから高さ500mの鏡の壁のレンダリングが外され、山・海岸・砂漠・野生動物の写真に置き換えられた。900万人、道路も車もない、という説明も主な紹介文から消えた（AGBI）。\n【要確認】Guardianの記事は原文未取得（要約サイトとArchinectの紹介で確認）。AGBIの記事の日付は未確認（2026年7月）。\n【第5章】5-1、5-4-1、5-6-4で論じる。", "era": "e_sns", "groups": ["g_gulf"], "id": "q_theline", "image": null, "intent": "i_build", "label": "NEOM《ザ・ライン》", "layer": [], "medium": ["m_digital"], "motif": ["m_mega", "m_blank", "m_tower"], "primary": "pr_online", "primaryRef": "【見込み】NEOMの公式サイト", "role": "paper", "shape": null, "showImage": false, "summary": "長さ170km・高さ500mの二枚の鏡の壁の中に900万人の都市を収める線状都市。第1期は2030年までに2.4kmと報じられ、公式サイトからレンダリングが外された。", "type": "work", "urls": [{"title": "Archinect: OMA, Peter Cook, Morphosis… (2023-02-02)", "url": "https://archinect.com/news/article/150337798/oma-peter-cook-morphosis-adjaye-associates-among-firms-showcasing-design-proposals-in-neom-s-recent-the-line-experience-exhibition"}, {"title": "Archinect: Oliver Wainwright explores the architectural history behind The Line (2022-09-13)", "url": "https://archinect.com/news/article/150323438/oliver-wainwright-explores-the-architectural-history-behind-saudi-arabia-s-planned-the-line-megacity"}, {"title": "Architectural Record: The Line drastically scales back (2024-04-17)", "url": "https://www.architecturalrecord.com/articles/16851-saudi-arabias-the-line-drastically-scales-back-its-ambitions"}, {"title": "AGBI: Neom rebrands The Line as costs and complexity bite (2026-07)", "url": "https://www.agbi.com/analysis/giga-projects/2026/07/neom-rebrands-the-line-as-costs-and-complexity-bite/"}, {"title": "Construction Briefing", "url": "https://www.constructionbriefing.com/8036596.article"}], "why": ["w_cond"], "year": 2021, "yearEnd": null, "yearU": false}, {"author": ["ax_048"], "channel": "ch_ext", "coding": "c_simple", "color": null, "country": "c_jp", "desc": "【流通】都の発表とウェブ上の画像。\n【糸】白紙：東京湾の将来像\n50年・100年先の東京湾岸の都市像を描いた都の構想。2021年に「Version1.0」を策定し、未来の街の画像を公開した。\n【第5章】5-4-1で論じる。", "era": "e_sns", "groups": ["g_inst"], "id": "q_tokyobay", "image": null, "intent": "i_both", "label": "東京都《東京ベイeSGプロジェクト》", "layer": [], "medium": ["m_digital"], "motif": ["m_blank"], "primary": "pr_online", "primaryRef": "【確認済】東京都の公式発表 https://www.metro.tokyo.lg.jp/tosei/hodohappyo/press/2024/09/27/08.html", "role": "paper", "shape": null, "showImage": false, "summary": "50年・100年先の東京湾岸の都市像を描いた都の構想。2021年に「Version1.0」を策定し、未来の街の画像を公開した。", "type": "work", "urls": [{"title": "東京都", "url": "https://www.metro.tokyo.lg.jp/tosei/hodohappyo/press/2024/09/27/08.html"}], "why": ["w_dream"], "year": 2021, "yearEnd": null, "yearU": false}, {"author": ["ax_082"], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "c_us", "desc": "【第3章】Instagramの10アカウントの一つ（2026年10月確定）。\n【系譜上の糸（第3章で選んだ理由）】教育の場で生まれるアンビルト／生成画像への批評的な距離。対応しうる古典：ヘイダック（クーパー・ユニオン）、チュミ《マンハッタン・トランスクリプツ》（1976–81）。10件のなかで糸がいちばん細い。\n【流通】Instagramへの投稿（開設年は要確認）。\n【糸】計算：生成AIで描く／ドローイング：一枚の絵として完結する連作\nネバダ大学ラスベガス校（UNLV）の建築学准教授が運営。2022年から生成AIを設計の過程に取り入れ、素材・質感・大気を探る画像を投稿する。2025年の調査時点で約16万のフォロワー。\n【v9】発表の場に「自主刊行・アカウント（自前の媒体）」を追加（第5章）。\n【第5章】5-3〜5-6（第3章の10アカウント）で論じる。", "era": nd": null, "yearU": false}, {"author": ["a_bal"], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "cx_11", "desc": "【第3章】Instagramの10アカウントの一つ（2026年10月確定）。\n【系譜上の糸（第3章で選んだ理由）】建築家ではない技術者による提案。対応しうる古典：フラー《マンハッタン・ドーム》（1960）。\n【糸】計算：生成AI。投稿の傾向（どのグループに入るか）はコーディング後に判定する。\nAIを用いたソフトウェア開発を本業とし、余暇に建築のビジュアライゼーションを制作。チューリッヒとラス・パルマスを拠点とする。開始年は要確認。\n【v9】発表の場に「自主刊行・アカウント（自前の媒体）」を追加（第5章）。\n【第5章】5-3〜5-6（第3章の10アカウント）で論じる。", "era": "e_sns", "groups": ["g_genai", "g_ig10"], "id": "s_ragingbal", "image": null, "intent": "i_nobuild", "label": "バラジ・バル（@raging_bal）", "layer": ["l_a", "l_c"], "medium": ["m_ai"], "motif": ["m_calc", "m_self"], "primary": "pr_online", "primaryRef": "【確認済】本人のInstagramの投稿と、本人の文章（Medium）。取得日を記録すること", "role": "paper", "shape": null, "showImage": false, "summary": "AIソフトウェア開発者が余暇に制作する、生成AIの建築ビジュアライゼーション。", "type": "account", "urls": [{"title": "Balaji Bal: AI in Architecture — notes from 3 years of explorations (Medium)", "url": "https://medium.com/@balajibal/ai-in-architecture-notes-from-3-years-of-explorations-b4b8eec09b72"}], "why": ["w_dream"], "year": 2022, "yearEnd": null, "yearU": true}, {"author": ["a_timfu"], "channel": "ch_sns", "coding": "c_simple", "color": null, "country": "c_uk", "desc": "【第3章】Instagramの10アカウントの一つ（2026年10月確定）。\n【系譜上の糸（第3章で選んだ理由）】実現への境界／ザハ・ハディドからの連続（ZHA CODE出身）／古典主義の再解釈。対応しうる古典：ザハ《ザ・ピーク》（1983）、クリエ《アトランティス》（1987–88）。\n【糸】擬似的な実現：画像から実施へ／計算：生成AIで設計／名前：ZHA出身という系譜\nZHAの計算設計グループ（ZHA CODE）出身。在籍中からMidjourneyでルネサンス様式を再解釈した画像を発信し、独立してロンドンに事務所を構えた。2025年には「初の全面的にAI駆動の建築」と称するスロベニア・ブレッド湖の別荘群を発表。SNSの生成画像が実施へ向かう、逆向きの例。開始年は要確認。\n【v9】発表の場に「自主刊行・アカウント（自前の媒体）」を追加（第5章）。\n【第5章】5-3〜5-6（第3章の10アカウント）で論じる。", "era": "e_sns", "groups": ["g_genai", "g_cyber", "g_ig10"], "id": "s_timfu", "image": null, "intent": "i_both", "label": "スタジオ・ティム・フー（@studiotimfu）", "layer": ["l_a", "l_c"], "medium": ["m_ai", "m_digital"], "motif": ["m_render", "m_calc", "m_name", "m_self"], "primary": "pr_online", "primaryRef": "【確認済】スタジオ・ティム・フーの投稿と公式サイト", "role": "
